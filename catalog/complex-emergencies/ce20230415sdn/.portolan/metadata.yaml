description: "UNOSAT geodata for Complex emergency, Sudan, 15 April 2023 (CE20230415SDN), from 1 dataset on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code: CE20230415SDN**  This map illustrates damage to structures in the city of El Fasher, North Darfur, Republic of Sudan.\nThe damage was investigated due to a significant occurrence of fire detections from May 9-20 2024. Fire detections are sourced from multiple US Government scientific satellites utilizing the MODIS and VIIRS sensors. While some fire detections may be non-violent in nature the large majority are firmly within areas of residential structures that show indications of burning in satellite imagery.\nDamaged areas are visible in satellite imagery from 11 November 2023 - 31 July 2024 and are heavily concentrated in the Eastern half of the city. In total,  more than 23,600 structures are estimated to have been damaged or destroyed in these areas. Out of these 23,600 structures, approximately 2,000 were found damaged before 9 May 2024; 9,500 between 9 May and 23 May 2024; over 4,600 between 23 May and 1 June 2024; 3,900 between 1 June and 12 June 2024; 600 between 12 June 2024 and 26 June 2024; and 2,900 between 26 June 2024 and 31 July 2024.\nThis is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to the United Nations Satellite Centre (UNOSAT).\n\nHDX datasets:\n\n- [El Fasher Damage Assessment Overview](https://data.humdata.org/dataset/el-fasher-damage-assessment-overview)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
