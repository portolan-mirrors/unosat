title: "Complex emergency, Myanmar, 26 March 2013 (CE20130326MMR)"
description: "UNOSAT geodata for Complex emergency, Myanmar, 26 March 2013 (CE20130326MMR), from 7 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\nThis map illustrates areas of satellite detected fires in Buthindaung, Maungdaw, and Rathedaung Townships in the Maungdaw and Sittwe Districts of Rakhine State in Myanmar. Analysis used satellite- fire detections collected by the Moderate Resolution Imaging Spectroradiometer (MODIS) and the Visible Infrared Imaging Radiometer Suite (VIIRS) on multiple dates from 25 August to 25 November 2017. A total of 171 fires were detected in different areas across Rathedaung, Buthindaung and Maungdaw townships during this period. While fire detections were spread out across the entire period analyzed, some notable clusters occurred on 28 August, 29 August, 3 September, 15 September, 25 September, 9 October, and 6 November, as indicated in the map. Days of peak fire detection occurred on 28 August and 15 September as indicated in the chart. Note that due to cloud cover and satellite overpass times many fires occurring in the area during this period would not have been detected, and are generally only detected if the satellites are overhead while the fire is sufficiently active and clouds are not interfering. This is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to UNITAR - UNOSAT.\n\nHDX datasets:\n\n- [Damage assessment in the Chein Khar Li (Ku Lar) village, Rakhine state, Myanmar](https://data.humdata.org/dataset/damage-assessment-in-the-chein-khar-li-ku-lar-village-rakhine-state-myanmar)\n- [Destroyed areas in Buthidaung, Maungdaw, and Rathedaung Townships of Rakhine State in Myanmar](https://data.humdata.org/dataset/destroyed-areas-in-buthidaung-maungdaw-and-rathedaung-townships-of-rakhine-state-in-myanmar-2727)\n- [Destroyed buildings in Maungdaw District, Myanmar](https://data.humdata.org/dataset/destroyed-buildings-in-maungdaw-district-myanmar)\n- [Destroyed buildings in Maungdaw and Buthindaung townships, Maungdaw District, Myanmar](https://data.humdata.org/dataset/destroyed-buildings-in-maungdaw-and-buthindaung-townships-maungdaw-district-myanmar)\n- [Fire Detections in Buthidaung, Maungdaw, and Rathedaung Townships of Rakhine State in Myanmar](https://data.humdata.org/dataset/fire-detections-in-buthidaung-maungdaw-and-rathedaung-townships-of-rakhine-state-in-myanmar-2746)\n- [Internally Displaced Persons Shelters in Maungdaw Township of Rakhine State in Myanmar](https://data.humdata.org/dataset/internally-displaced-persons-shelters-in-maungdaw-township-of-rakhine-state-in-myanmar-2731)\n- [Update: Destroyed buildings in Maungdaw and Buthindaung townships, Maungdaw District, Myanmar](https://data.humdata.org/dataset/destroyed-buildings-in-maungdaw-and-buthindaung-townships-maungdaw-district-myanmar-2697)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
