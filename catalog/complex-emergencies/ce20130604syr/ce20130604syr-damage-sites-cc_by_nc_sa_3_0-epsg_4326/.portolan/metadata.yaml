processing_notes: "Downloaded from HDX on 2026-11-22 and converted with GDAL ogr2ogr (to GeoPackage, multi-part geometry types, OGR_ORGANIZE_POLYGONS=CCW_INNER_JUST_AFTER_CW_OUTER) and geoparquet-io (GeoParquet 2.0, no geometry repair, bbox column added). Geometry is kept as published; no feature was repaired, dropped, or reprojected. Each layer's row count was checked against the source feature count. Layers merged with DuckDB `UNION ALL BY NAME`: a column a layer lacks is null for its rows. Coded geodatabase domains are decoded into `<field>_label` columns, per source file. Source layers: `Damage_Sites_Al_Quaryatayn_20160507`, `Damage_Sites_Palmyra_Tadmur_20160330`, `Damage_sites_Update3_Aleppo_20150426`, `Damage_sites_Update3_Daraa_20150604`, `Damage_sites_Update3_Deir_Ez_Zor_20150510`, `Damage_sites_Update3_Idlib_20150406`, `Damage_sites_Update3_Raqqa_20150529`, `Damage_sites_Update_Aleppo_20140523`, `Damage_sites_Update_Daraa_20140501`, `Damage_sites_Update_Deir_Ez_Zor_20140513`, `Damage_sites_Update_Hama_20140305`, `Damage_sites_Update_Homs_20140421`, `Damage_sites_Update_Idlib_20140502`, `Damage_sites_Update_Raqqa_20140212`, `Damage_sites_Update_all`, `Kobane_Damage_Sites`."
known_issues: "This is a preliminary assessment and has not yet been validated in the field. It is important to consider the characteristics of the source imagery used in the analyses when interpreting results. For damage assessments it should be noted that only significant damage to the structural integrity of the buildings analyzed can be seen in imagery, while minor damage such as cracks or holes may not be visible at all. For flood extractions using radar data it is important to note that urban areas and highly vegetated areas may mask the flood signature and result in underestimation of flood waters. Users with specific questions or concerns should contact unosat@unitar.org to seek clarification."
