processing_notes: "Downloaded from HDX on 2026-11-22 and converted with GDAL ogr2ogr (to GeoPackage, multi-part geometry types, OGR_ORGANIZE_POLYGONS=CCW_INNER_JUST_AFTER_CW_OUTER) and geoparquet-io (GeoParquet 2.0, no geometry repair, bbox column added). Geometry is kept as published; no feature was repaired, dropped, or reprojected. Each layer's row count was checked against the source feature count. Layers merged with DuckDB `UNION ALL BY NAME`: a column a layer lacks is null for its rows. Coded geodatabase domains are decoded into `<field>_label` columns, per source file. Source layers: `PHR_20211221_DamagedSchoolHospital_PalawanIsland`, `PHR_20211221_Damaged_CityofNaga`, `PHR_20211221_Damaged_CityofTalisay_Cebu`, `PHR_20211221_Damaged_PalawanIsland`, `PHR_20211221_PotentiallyDamaged_CityofNaga`, `PHR_20211221_PotentiallyDamaged_CityofTalisay_Cebu`, `PHR_20211221_PotentiallyDamaged_PalawanIsland`, `PHR_20211222_Damaged_LaLibertad_NegrosIsland`, `PHR_20211222_PotentiallyDamaged_LaLibertad_NegrosIsland`, `PHR_20211223_DamagedPort_DinagatIsland`, `PHR_20211223_Damaged_CarcarCity_SanFernando`, `PHR_20211223_Damaged_DinagatIsland`, `PHR_20211223_Damaged_NorthernBoholIsland_Center`, `PHR_20211223_Damaged_NorthernBoholIsland_NW`, `PHR_20211223_Damaged_NorthernBoholIsland_SE`, `PHR_20211223_Damaged_SouthernLeyteProvince`, `PHR_20211223_PotentiallyDamaged_CarcarCity_SanFernando`, `PHR_20211223_PotentiallyDamaged_DinagatIsland`, `PHR_20211223_PotentiallyDamaged_Dumaran`, `PHR_20211223_PotentiallyDamaged_NorthernBoholIsland_Center`, `PHR_20211223_PotentiallyDamaged_NorthernBoholIsland_NW`, `PHR_20211223_PotentiallyDamaged_NorthernBoholIsland_SE`, `PHR_20211226_Damaged_GeneralLuna`, `PHR_20211226_PotentiallyDamaged_GeneralLuna`, `WV3_20211217_DamagedBridge_Socorro`, `WV3_20211217_Damaged_Socorro`, `WV3_20211217_PotentiallyDamaged_Socorro`, `WV3_20211217_Road_Obstacle_Socorro`."
known_issues: "HDX states the license as \"Creative Commons Attribution Share-Alike (CC BY-SA)\" with no version, so the collection's license is `other`, linked to the license definition HDX gives. This is a preliminary assessment and has not yet been validated in the field. It is important to consider the characteristics of the source imagery used in the analyses when interpreting results. For damage assessments it should be noted that only significant damage to the structural integrity of the buildings analyzed can be seen in imagery, while minor damage such as cracks or holes may not be visible at all. For flood extractions using radar data it is important to note that urban areas and highly vegetated areas may mask the flood signature and result in underestimation of flood waters. Users with specific questions or concerns should contact unosat@unitar.org to seek clarification."
