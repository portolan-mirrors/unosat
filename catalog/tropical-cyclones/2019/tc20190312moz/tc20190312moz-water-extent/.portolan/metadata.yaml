processing_notes: "Downloaded from HDX on 2026-11-22 and converted with GDAL ogr2ogr (to GeoPackage, multi-part geometry types, OGR_ORGANIZE_POLYGONS=CCW_INNER_JUST_AFTER_CW_OUTER) and geoparquet-io (GeoParquet 2.0, no geometry repair, bbox column added). Geometry is kept as published; no feature was repaired, dropped, or reprojected. Each layer's row count was checked against the source feature count. Layers merged with DuckDB `UNION ALL BY NAME`: a column a layer lacks is null for its rows. Coded geodatabase domains are decoded into `<field>_label` columns, per source file. Source layers: `ST1_20190313_WaterExtent_SofalaProvince`, `ST1_20190314_WaterExtent_SofalaProvince`, `ST1_20190319_WaterExtent_ManicaSofalaProvinces`, `ST1_20190319_WaterExtent_SofalaProvince`, `ST1_20190320_WaterExtent_SofalaProvince`, `ST1_20190320_WaterExtent_TeteZambeziaProvinces`, `ST1_20190326_WaterExtent_SofalaProvince`, `ST_20190319_Flood_Water_Dombe_Grudja`, `ST_20190407_WaterExtent_Tete_Zambezia_Provinces`."
known_issues: "HDX states the license as \"Creative Commons Attribution Share-Alike (CC BY-SA)\" with no version, so the collection's license is `other`, linked to the license definition HDX gives. From UNOSAT documentation: \"It is likely that flood waters have been systematically underestimated along highly vegetated areas along main river banks and within built-up urban areas because of the special characteristics of the satellite data used. \" This is a preliminary assessment and has not yet been validated in the field. It is important to consider the characteristics of the source imagery used in the analyses when interpreting results. For damage assessments it should be noted that only significant damage to the structural integrity of the buildings analyzed can be seen in imagery, while minor damage such as cracks or holes may not be visible at all. For flood extractions using radar data it is important to note that urban areas and highly vegetated areas may mask the flood signature and result in underestimation of flood waters. Users with specific questions or concerns should contact unosat@unitar.org to seek clarification."
