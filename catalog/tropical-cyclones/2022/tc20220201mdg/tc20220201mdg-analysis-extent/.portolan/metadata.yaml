processing_notes: "Downloaded from HDX on 2026-11-22 and converted with GDAL ogr2ogr (to GeoPackage, multi-part geometry types, OGR_ORGANIZE_POLYGONS=CCW_INNER_JUST_AFTER_CW_OUTER) and geoparquet-io (GeoParquet 2.0, no geometry repair, bbox column added). Geometry is kept as published; no feature was repaired, dropped, or reprojected. Each layer's row count was checked against the source feature count. Layers merged with DuckDB `UNION ALL BY NAME`: a column a layer lacks is null for its rows. Coded geodatabase domains are decoded into `<field>_label` columns, per source file. Source layers: `K5_20220212_AnalysisExtent_HauteMatsiatra`, `RCM3_20220208_AnalysisExtent_Vangaindrano_Farafangana`, `S1_20220208_AnalysisExtent_AmboasaryAtsimo_Taolagnaro`, `S1_20220208_AnalysisExtent_Midongy_Atsimo`, `S1_20220208_AnalysisExtent_VatovavyFitovinany`, `S1_20220215_AnalysisExtent_Farafangana`, `S1_20220215_AnalysisExtent_Vangaindrano_Farafangana`, `S2_20220207_AnalysisExtent_Miandrivozo`, `S2_20220207_CloudObstruction_Miandrivozo`, `S2_20220209_AnalysisExtent_Betroka`, `S2_20220209_CloudObstruction_Betroka`, `TSX_20220208_AnalysisExtent_Farafangana`."
known_issues: "HDX states the license as \"Creative Commons Attribution Share-Alike (CC BY-SA)\" with no version, so the collection's license is `other`, linked to the license definition HDX gives. This is a preliminary assessment and has not yet been validated in the field. It is important to consider the characteristics of the source imagery used in the analyses when interpreting results. For damage assessments it should be noted that only significant damage to the structural integrity of the buildings analyzed can be seen in imagery, while minor damage such as cracks or holes may not be visible at all. For flood extractions using radar data it is important to note that urban areas and highly vegetated areas may mask the flood signature and result in underestimation of flood waters. Users with specific questions or concerns should contact unosat@unitar.org to seek clarification."
