description: "Water extent for Tropical cyclone, Lao People's Democratic Republic, 22 July 2025 (TC20250722LAO): 32 features merged from 32 source layers. Polygon layers with a water class column (such as `Water_Class`), or whose names mention flood, water, or inundation: satellite-detected water. The `source_layer` and `source_file` columns name the layer and file each row came from.\n\nFrom these HDX datasets:\n\n- [Mudflow impact in Kham District, Xiengkhouang Province, Lao PDR  as of 2 August 2025](https://data.humdata.org/dataset/mudflow-impact-in-kham-district-xiengkhouang-province-lao-pdr-as-of-2-august-2025)\n- [Preliminary Satellite-derived Flood Impact Assessment, Muang Sam Tai, Xamtay District, Houaphan Province, LAO PDR, 29 July 2025](https://data.humdata.org/dataset/preliminary-satellite-derived-flood-impact-assessment-muang-sam-tai-xamtay-district-houaph)\n- [Satellite detected water extents in Bolikhamxai  and Khammouan Provinces, Lao PDR as of 28 July 2025](https://data.humdata.org/dataset/water-extents-in-bolikhamxai-and-khammouan-provinces-lao-pdr-as-of-28-july-2025)\n- [Satellite detected water extents in Bolikhanh and Pakxane Districts, Bolikhamxai Province, Lao PDR as of 23 July 2025](https://data.humdata.org/dataset/water-extents-in-bolikhanh-and-pakxane-districts-bolikhamxai-province-lao-pdr-as-of-23-jul)\n- [Satellite detected water extents in Pakkading District, Bolikhamxai Province Lao PDR as of 23 July 2025](https://data.humdata.org/dataset/water-extents-in-pakkading-district-bolikhamxai-province-lao-pdr-as-of-23-july-2025)\n- [Satellite detected water extents in Pek and Phaxay Districts, Xiengkhouang Province, Lao PDR as of 23 July 2025](https://data.humdata.org/dataset/water-extents-in-pek-and-phaxay-districts-xiengkhouang-province-lao-pdr-as-of-23-july-2025)\n- [Satellite detected water extents in Thoulakhom District, Vientiane Province and Xaythany District, Vientiane Capital, Lao PDR as of 23 July 2025](https://data.humdata.org/datase