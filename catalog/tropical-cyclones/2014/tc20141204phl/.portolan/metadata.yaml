description: "UNOSAT geodata for Tropical cyclone, Philippines, 4 December 2014 (TC20141204PHL), from 8 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\nThis map illustrates satellite-detected damaged structures in Dolores City, East Samar Province, Philippines. Using an image acquired by the WorldView-2 satellite on 12 December 2014 and compared with an image collected on 19 June 2014, UNOSAT identified 597 affected structures in the area. Specifically, 193 structures were categorized as destroyed, 225 as severely damaged and 179 as moderately damaged. Note that due to significant cloud cover present on the post-event image, the north and northwestern parts of the city could not be analysed. This is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to UNITAR / UNOSAT.\n\nHDX datasets:\n\n- [Geodata of Damaged Structures in Borongan, Eastern Samar Province, Philippines](https://data.humdata.org/dataset/geodata-of-damaged-structures-in-borongan-eastern-samar-province-philippines-december-18-2014)\n- [Geodata of Damaged Structures in Calbayog City, Samar Island, Philippines](https://data.humdata.org/dataset/geodata-of-damaged-structures-in-calbayog-city-samar-island-philippines-december-11-2014)\n- [Geodata of Damaged Structures in Dolores City, East Samar, Philippines](https://data.humdata.org/dataset/geodata-of-damaged-structures-in-dolores-city-east-samar-philippines-december-15-2014)\n- [Geodata of Damaged Structures in Guiuan City, Eastern Samar, Philippines](https://data.humdata.org/dataset/geodata-of-damaged-structures-in-guiuan-city-eastern-samar-philippines-december-11-2014)\n- [Geodata of Damaged Structures in San Julian Area, Eastern Samar, Philippines](https://data.humdata.org/dataset/geodata-of-damaged-structures-in-san-julian-area-eastern-samar-philippines-december-17-2014)\n- [Geodata of Damaged Structures in Taft City, Eastern Samar Province, Philippines](https://data.humdata.org/data