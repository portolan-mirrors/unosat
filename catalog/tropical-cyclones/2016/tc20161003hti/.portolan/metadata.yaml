title: "Tropical cyclone, Cuba, Dominican Republic, Haiti and 1 more, 3 October 2016 (TC20161003HTI)"
description: "UNOSAT geodata for Tropical cyclone, Cuba, Dominican Republic, Haiti and 1 more, 3 October 2016 (TC20161003HTI), from 13 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\nThis report describes preliminary building damage analysis carried out by UNITAR-UNOSAT covering Area 1 (Jeremie and Roseaux Commune), Area 2 (Abricot, Dame-Marie, Anse d'Hainaults and Les Irois Communes), Area 3 (Corail, Pestel, Beaumont and Roseaux Communes), and Area 4 (Tiburon Commune) for a total area of approximately 1,200 Km2.\nBuilding damage analysis, including a rapid assessment of transportation network conditions and locations of spontaneous people gathering sites, was conducted by comparing the post-disaster satellite images (Pleiades acquired on 7/10/2016 for AOI1, Pleiades acquired on 12/10/2016 for AOI2, Pleiades acquired on 09/11/2016 for AOI3 and Worldview-2 acquired on 9/10/2016 & 17/10/2016 for AOI4) with available pre-disaster images (WorldView-1 on 08/12/2014, 01/05/2015, 09/05/2015 and 16/06/2015; Worldview-2 on 17/07/2016, 28/11/2014 and 14/06/2015 and Worldview-3 on 17/10/2015).\nUNOSAT's preliminary analysis shows a total of 40,696 buildings/structures with visible damages and approximately 508 locations with visible road obstacles and/or access constraints. In addition, 1,497 temporary people gathering sites have been identified within the analysed areas (Area 1, Area 2, Area 3 and Area 4).\n\nHDX datasets:\n\n- [Cuba - Population Exposure Wind Speed from Hurricane Matthew (UNOSAT, 2016-10-06.)](https://data.humdata.org/dataset/unosat-cuba-popexposure-windspeed-matthew-20161006)\n- [Damage Assessment Overview of Jérémie area, Grande Anse Department](https://data.humdata.org/dataset/damage-assessment-overview-of-jeremie-area-grande-anse-department)\n- [Damage Assessment Overview of Tiburon Commune, Sud Department](https://data.humdata.org/dataset/damage-assessment-overview-of-tiburon-commune-sud-department)\n- [Damage Assessment of Tiburon town and surroundings](https://data.humdata.org/dataset/damage-assessment-of-tiburon-town-and-surroundings)\n- [Dominican Republic - Population Exposure Wind Speed from Hurricane Matthew (UNOSAT, 2016-10-06)](https://data.humdata.org/dataset/unosat-dominicanrep-popexposure-windspeed-matthew-20161006)\n- [Haiti - Damage Assessment Overview of Dame Marie and Anse d'Hainault Areas, Grande Anse & Sud Departments](https://data.humdata.org/dataset/damage-assessment-overview-of-dame-marie-and-anse-d-hainault-areas-grande-anse-sud-departments)\n- [Haiti - Population Exposure Wind Speed from Hurricane Matthew (UNOSAT, 2016-10-06)](https://data.humdata.org/dataset/unosat-haiti-popexposure-windspeed-matthew-20161006)\n- [Hazard Flood Zones](https://data.humdata.org/dataset/hazard-flood-zones)\n- [Jamaica - Population Exposure  Wind Speed from Hurricanne Matthew (UNOSAT - 2016-10-06)](https://data.humdata.org/dataset/unosat-jamaica-popexposure-windspeed-matthew-20161006)\n- [Population Exposed to Wind Speed Zones](https://data.humdata.org/dataset/population-exposed-to-wind-speed-zones)\n- [Preliminary Satellite Based Damage Assessment Report - UPDATE 1: Grand Anse Département, Haiti](https://data.humdata.org/dataset/preliminary-satellite-based-damage-assessment-report-update-1-grand-anse-departement-haiti)\n- [Preliminary Satellite Based Damage Assessment Report - UPDATE 3: Grand Anse and Sud Départements, Haiti](https://data.humdata.org/dataset/preliminary-satellite-based-damage-assessment-report-update-3-grand-anse-and-sud-departements-haiti)\n- and 1 more; the event's [catalog page](../catalog.json) lists them all.\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
