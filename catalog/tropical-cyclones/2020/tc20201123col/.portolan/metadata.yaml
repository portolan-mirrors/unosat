description: "UNOSAT geodata for Tropical cyclone, Colombia, 23 November 2020 (TC20201123COL), from 2 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code: TC20201123COL**  This map illustrates potentially damaged structures and buildings in San Andres Island, Providencia and Santa Catalina department of Colombia as detected by satellite image acquired after landfall of the Tropical Cyclone IOTA on 17 November 2020.\nUNITAR-UNOSAT analysis used a WorldView-2 image acquired on 18 November 2020 as a post-event image. Within the Island boundary, UNITAR-UNOSAT identified in the cloud-free zones 220 Potentially damaged structures. Taking into account the pre-building footprints provided by Humanitarian OpenStreetMap, this represents about 6% of the total number of structures within the analyzed cloud-free areas.\n\nHDX datasets:\n\n- [Damage Assessment in Providencia Island, Providencia and Santa Catalina Department, Colombia as of 21 November 2020](https://data.humdata.org/dataset/damage-assessment-in-providencia-island-providencia-and-santa-catalina-department-colombia)\n- [Damage Assessment in San Andres Island, Providencia and Santa Catalina Department, Colombia as of 18 November 2020](https://data.humdata.org/dataset/damage-assessment-in-san-andres-island-providencia-and-santa-catalina-department-colombia-)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
