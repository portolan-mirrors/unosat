description: "UNOSAT geodata for Tropical cyclone, Viet Nam, 28 October 2020 (TC20201028VNM), from 14 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code: TC20201028VNM**  This map illustrates satellite-detected surface waters in Thua Thien Hue Province of Viet Nam as observed from a Sentinel-1 image acquired on 29 October 2020 at about 05:43 local time. Within the analyzed area of about 5,000 km2, a total of about 270 km2 of lands appear to be flooded. The water extent appears to have increased of about 40 km2 since 25 October 2020. Based on Worldpop population data and the detected surface waters, about 100,000 people are potentially exposed or living close to flooded areas.\nThis is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to UNITAR-UNOSAT.\nImportant Note: Flood analysis from radar images may underestimate the presence of standing waters in built-up areas and densely vegetated areas due to backscattering properties of the radar signal.\n\nHDX datasets:\n\n- [Satellite detected waters in Binh Dinh Province of Viet Nam as of 30 October 2020](https://data.humdata.org/dataset/satellite-detected-waters-in-binh-dinh-province-of-viet-nam-as-of-30-october-2020)\n- [Satellite detected waters in Da Nang City of Viet Nam as of 30 October 2020](https://data.humdata.org/dataset/satellite-detected-waters-in-da-nang-city-of-viet-nam-as-of-30-october-2020)\n- [Satellite detected waters in Ha Tinh Province of Viet Nam as of 3 November 2020](https://data.humdata.org/dataset/satellite-detected-waters-in-ha-tinh-province-of-viet-nam-as-of-3-november-2020)\n- [Satellite detected waters in Ha Tinh Province of Viet Nam as of 30 October 2020](https://data.humdata.org/dataset/satellite-detected-waters-in-ha-tinh-province-of-viet-nam-as-of-30-october-2020)\n- [Satellite detected waters in Ha Tinh Province of Viet Nam as of 9 November 2020](https://data.humdata.org/dataset/satellite-detected-waters-in