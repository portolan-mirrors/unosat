processing_notes: "Downloaded from HDX on 2026-11-22 and converted with GDAL ogr2ogr (to GeoPackage, multi-part geometry types, OGR_ORGANIZE_POLYGONS=CCW_INNER_JUST_AFTER_CW_OUTER) and geoparquet-io (GeoParquet 2.0, no geometry repair, bbox column added). Geometry is kept as published; no feature was repaired, dropped, or reprojected. Each layer's row count was checked against the source feature count. Layers merged with DuckDB `UNION ALL BY NAME`: a column a layer lacks is null for its rows. Coded geodatabase domains are decoded into `<field>_label` columns, per source file. Source layers: `NOAA_20201113_20201117_FloodExtent_Honduras`, `NOAA_20201125_20201129_FloodExtent_Honduras`, `NOAA_20201125_20201129_WaterExtent_Honduras`, `ST1_20201118_FloodExtent_Atlantida`, `ST1_20201118_FloodExtent_Colon`, `ST1_20201118_FloodExtent_Cortes`, `ST1_20201118_FloodExtent_Olancho`, `ST1_20201118_WaterExtent_Atlantida`, `ST1_20201118_WaterExtent_Colon`, `ST1_20201118_WaterExtent_Cortes`, `ST1_20201118_WaterExtent_Olancho`, `ST1_20201123_FloodExtent_Cortes`, `ST1_20201123_WaterExtent_Cortes`, `ST1_20201125_FloodExtent_Cortes`, `ST1_20201125_FloodExtent_Gracias_a_Dios`, `ST1_20201125_WaterExtent_Cortes`, `ST1_20201125_WaterExtent_Gracias_a_Dios`."
known_issues: "HDX states the license as \"Creative Commons Attribution Share-Alike (CC BY-SA)\" with no version, so the collection's license is `other`, linked to the license definition HDX gives. This is a preliminary assessment and has not yet been validated in the field. It is important to consider the characteristics of the source imagery used in the analyses when interpreting results. For damage assessments it should be noted that only significant damage to the structural integrity of the buildings analyzed can be seen in imagery, while minor damage such as cracks or holes may not be visible at all. For flood extractions using radar data it is important to note that urban areas and highly vegetated areas may mask the flood signature and result in underestimation of flood waters. Users with specific questions or concerns should contact unosat@unitar.org to seek clarification."
