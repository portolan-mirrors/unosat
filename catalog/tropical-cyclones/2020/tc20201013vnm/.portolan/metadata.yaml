description: "UNOSAT geodata for Tropical cyclone, Viet Nam, 13 October 2020 (TC20201013VNM), from 13 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code: TC20201013VNM**  This map illustrates satellite-detected surface waters in Ha Tinh and Nghe An Provinces of Viet Nam as observed from a Sentinel-1 image acquired on 21 October 2020. Within the analyzed area of about 8,000 km2, a total of about 300 km2 of lands appear to be flooded. In Ha Tinh province, the water extent appears to have receded of about 200 km2 since 18 October 2020. Based on Worldpop population data and the detected surface waters, about 100,000 people are potentially exposed or living close to flooded areas. The potentially exposed population is mainly located in the districts of Cam Xuyen with ~15,000 people, Can Loc with ~15,000 people and Thach Ha with ~15,000 people.  This is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to UNITAR-UNOSAT.\nImportant Note: Flood analysis from radar images may underestimate the presence of standing waters in built-up areas and densely vegetated areas due to backscattering properties of the radar signal.\n\nHDX datasets:\n\n- [Satellite detected waters in Ha Tinh and Nghe An Provinces of Viet Nam as of 18 October 2020](https://data.humdata.org/dataset/waters-in-ha-tinh-and-nghe-an-provinces-of-viet-nam-as-of-18-october-2020)\n- [Satellite detected waters in Ha Tinh and Nghe An Provinces of Viet Nam as of 21 October 2020](https://data.humdata.org/dataset/waters-in-ha-tinh-and-nghe-an-provinces-of-viet-nam-as-of-21-october-2020)\n- [Satellite detected waters in Minh Hoa and Tuyen Hoa district, Quang Binh province of Viet Nam as of 19 October 2020](https://data.humdata.org/dataset/waters-in-minh-hoa-and-tuyen-hoa-district-quang-binh-province-of-viet-nam-as-of-19-october)\n- [Satellite detected waters in Quang Binh Province of Viet Nam as of 18 October 2020](https://data.humdata.org/d