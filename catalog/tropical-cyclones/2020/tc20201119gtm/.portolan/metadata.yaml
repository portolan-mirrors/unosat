description: "UNOSAT geodata for Tropical cyclone, Guatemala, 19 November 2020 (TC20201119GTM), from 4 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code: TC20201119GTM**  This map illustrates satellite-detected surface waters in Peten, Alta Verapaz and Quiche departments of Guatemala & Chiapas state of Mexico as observed from a Sentinel-1 image acquired on 22 November 2020 at 05:53 Local time. Within the analyzed area of about 10,000 km2, a total of about 380 km2 of lands appear to be flooded. Based on Worldpop population data and the detected surface waters, about 24,000 people are potentially exposed or living close to flooded areas.\nThis is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to UNITAR-UNOSAT.\nImportant Note: Flood analysis from radar images may underestimate the presence of standing waters in built-up areas and densely vegetated areas  due to backscattering properties of the radar signal.\n\nHDX datasets:\n\n- [Satellite detected water in Izabal department of Guatemala as of 23 November 2020](https://data.humdata.org/dataset/satellite-detected-water-in-izabal-department-of-guatemala-as-of-23-november-2020)\n- [Satellite detected waters in Alta Verapaz, Izabal and Zacapa departments of Guatemala as of 18 November 2020](https://data.humdata.org/dataset/waters-in-alta-verapaz-izabal-and-zacapa-departments-of-guatemala-as-of-18-november-2020)\n- [Satellite detected waters in Peten Department of Guatemala & Chiapas State of Mexico as of 22 November 2020](https://data.humdata.org/dataset/waters-in-peten-department-of-guatemala-chiapas-state-of-mexico-as-of-22-november-2020)\n- [Satellite detected waters in Petén department of Guatemala as of 18 November 2020](https://data.humdata.org/dataset/satellite-detected-waters-in-peten-department-of-guatemala-as-of-18-november-2020)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
