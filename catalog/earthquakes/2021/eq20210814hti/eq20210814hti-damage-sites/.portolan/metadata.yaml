description: "Damage sites for Earthquake, Haiti, 14 August 2021 (EQ20210814HTI): 583 features merged from 15 source layers. Point layers with a damage class column (such as `Main_Damage_Site_Class`): one point per assessed structure or site. The `source_layer` and `source_file` columns name the layer and file each row came from.\n\nFrom these HDX datasets:\n\n- [14 August 2021 M7.2 Haiti Earthquake. Preliminary Satellite-Based Comprehensive Damage Assessment Report](https://data.humdata.org/dataset/14-august-2021-m7-2-haiti-earthquake-preliminary-satellite-based-comprehensive-damage-asse)\n- [Damage Assessment  in Baraderes commune,  Nippes department,  Haiti as of 18 August 2021](https://data.humdata.org/dataset/damage-assessment-in-baraderes-commune-nippes-department-haiti-as-of-18-august-2021)\n- [Damage Assessment in Chardonnieres commune, South department as of 23 August 2021](https://data.humdata.org/dataset/damage-assessment-in-chardonnieres-commune-south-department-as-of-23-august-2021)\n- [Damage Assessment in Les Anglais commune, South department as of 23 August 2021](https://data.humdata.org/dataset/damage-assessment-in-les-anglais-commune-south-department-as-of-23-august-2021)\n- [Damage Assessment in Nippes department, Haiti as of 16 August 2021](https://data.humdata.org/dataset/damage-assessment-in-nippes-department-haiti-as-of-16-august-2021)\n- [Damage Assessment in Port-A-Piment and Coteaux communes, South department as of 23 August 2021](https://data.humdata.org/dataset/damage-assessment-in-port-a-piment-and-coteaux-communes-south-department-as-of-23-august-2)\n\nRead [AGENTS.md](AGENTS.md) for the columns and query recipes."
