title: "Earthquake, Iraq, 12 November 2017 (EQ20171112IRQ)"
description: "UNOSAT geodata for Earthquake, Iraq, 12 November 2017 (EQ20171112IRQ), from 4 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\nThis map illustrates satellite-detected damaged and potentially damaged buildings and the related density of damage in the areas north of Sarpol-e-Zahab county in Kermanshah province, Iran following the M 7.3 earthquake that struck the area on the 12 November 2017. The analysis was carried out comparing a post-event Pleiades image acquired on the 16 November 2017 with a pre-event WorldView3 image of 24 July 2017. The results indicate damage across several localities and villages in this zone and about 3300 structures were identified as potentially damaged (e.g. 362 in Koeeke Hasan; 148 in Tapamaran and 98 in Jaberi). This is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to UNITAR - UNOSAT.\n\nHDX datasets:\n\n- [Buildings Damage Assessment & Related Density North of  Sarpol-e-Zahab County, Iran](https://data.humdata.org/dataset/buildings-damage-assessment-related-density-north-of-sarpol-e-zahab-county-iran-2737)\n- [Damage Assessment of Koeeke Hasan Town and Surroundings, Kermanshah, Iran](https://data.humdata.org/dataset/damage-assessment-of-koeeke-hasan-town-and-surroundings-kermanshah-iran-2736)\n- [Damaged structures and related density map in Sarpol-e-Zahab, Kermanshah, Iran](https://data.humdata.org/dataset/damaged-structures-and-related-density-map-in-sarpol-e-zahab-kermanshah-iran-2732)\n- [Shelters and people gathering sites in Sarpol-e-Zahab, Kermanshah, Iran](https://data.humdata.org/dataset/shelters-and-people-gathering-sites-in-sarpol-e-zahab-kermanshah-iran-2729)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
