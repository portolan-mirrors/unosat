description: "UNOSAT geodata for Earthquake, Ecuador, 17 April 2016 (EQ20160417ECU), from 9 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\nThis map illustrates satellite-detected areas of damage and related density  in Jama city, Manabi Province, Ecuador. Located at approximately 100 km south of the 16 April 2016 Muisne earthquake mainshock epicenter and using a WorldView-2 satellite image acquired 02 May 2016 and a WorldView- 2 image acquired 02 December 2013. UNITAR-UNOSAT created a damage  site density index for affected areas in the city of Jama. The analysis  revealed a total of 151 potentially damaged structures of which 105 are destroyed, 34 severely damaged and 12 moderately damaged. This is a preliminary analysis and not yet been validated in the field. Please send ground feedback to UNITAR-UNOSAT.\n\nHDX datasets:\n\n- [Geodata of Damage Assessment of Atacames area, Esmeraldas Province, Ecuador](https://data.humdata.org/dataset/geodata-of-damage-assessment-of-atacames-area-esmeraldas-province-ecuador-april-20-2016)\n- [Geodata of Damage Assessment of Bahia de Caraquez, Manabi Province, Ecuador](https://data.humdata.org/dataset/geodata-of-damage-assessment-of-bahia-de-caraquez-manabi-province-ecuador-april-21-2016)\n- [Geodata of Damage Assessment of Chone area, Manabi Province, Ecuador](https://data.humdata.org/dataset/geodata-of-damage-assessment-of-chone-area-manabi-province-ecuador-april-25-2016)\n- [Geodata of Damage Assessment of Crucita Area, Manabi Province, Ecuador](https://data.humdata.org/dataset/geodata-of-damage-assessment-of-crucita-area-manabi-province-ecuador-april-20-2016)\n- [Geodata of Damage Assessment of Muisne, Esmeraldas Province, Ecuador](https://data.humdata.org/dataset/geodata-of-damage-assessment-of-muisne-esmeraldas-province-ecuador-april-22-2016)\n- [Geodata of Damage Assessment of Salinas and La Libertad Areas, Santa Elena Province, Ecuador](https://data.humdata.org/dataset/geodata-of-damage-assessment-