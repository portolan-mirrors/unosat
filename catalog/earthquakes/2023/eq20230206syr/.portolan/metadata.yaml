description: "UNOSAT geodata for Earthquake, Syrian Arab Republic, Türkiye, 6 February 2023 (EQ20230206SYR), from 17 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code EQ20230206SYR, GDACS Id: 1357372**  This report provides satellite-based comprehensive damage assessment results over Syria following the 06th of February 2023 Marash/Antep earthquakes sequence which struck southern Türkiye and north-western parts of Syria. The mainshock measured a magnitude of 7.8 and occurred at a crucial moment, 4:15 am local time, when most people were at home sleeping. It was a shallow depth earthquake with an epicentre located about 35 km north-west of the Turkish city of Gaziantep.\nThese earthquakes caused more than 46,000 deaths in Türkyie and over 4,500 in northwest Syria. The humanitarian community estimated that 8.8 million people live in the most affected areas in Syria. Overall, 170 sub-districts in 43 districts in 10 of Syria’s governorates have been impacted by the earthquake.\nThis is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to United Nations Satellite Centre (UNOSAT).\n\nHDX datasets:\n\n- [6 February 2023 M 7.8 Marash/Antep (Kehramanmarash) Earthquake, Preliminary Satellite-Based Comprehensive Damage Assessment Report](https://data.humdata.org/dataset/6-february-2023-m-7-8-marash-antep-kehramanmarash-earthquake-preliminary-satellite-based-c)\n- [Damage Assessment  in Jableh City, Jableh District, Latakia Province, Syria as of 9 February 2023](https://data.humdata.org/dataset/damage-assessment-in-jableh-city-jableh-district-latakia-province-syria-as-of-9-february-2)\n- [Damage Assessment Istamo (Latakia) as of 9 February 2023](https://data.humdata.org/dataset/damage-assessment-istamo-latakia-as-of-9-february-2023)\n- [Damage Assessment in A'zaz City, Aleppo Governorate, Syria as of 9 February 2023](https://data.humdata.org/dataset/damage-assessment-in-a-zaz-city-aleppo-governora