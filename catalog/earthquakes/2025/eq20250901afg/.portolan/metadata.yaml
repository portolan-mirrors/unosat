description: "UNOSAT geodata for Earthquake, Afghanistan, 1 September 2025 (EQ20250901AFG), from 2 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code: EQ20250901AFG, GDACS ID: 1498339**  This map illustrates the potentially damaged structures/buildings affected by the August 31, 2025, earthquake in Afghanistan. The analysis focuses on  Jalalabad City and surrounding area, Nangarhar Province, where damage was detected using a Pleiades very high-resolution satellite image acquired on September 2, 2025. UNOSAT identified 12 damaged building and 69 potentially damaged buildings.\nThis is a preliminary analysis and has not yet been validated in the field. Ground verification is encouraged, and feedback can be sent to the United Nations Satellite Centre (UNOSAT).\n\nHDX datasets:\n\n- [Damage Assessment in Jalalabad City, Nangarhar Province as of 2 September 2025](https://data.humdata.org/dataset/damage-assessment-in-jalalabad-city-nangarhar-province-as-of-2-september-2025)\n- [UNOSAT Live web map -M 6.0 Afghanistan Earthquake (31 August 2025)](https://data.humdata.org/dataset/unosat-live-web-map-m-6-0-afghanistan-earthquake-31-august-2025)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
