processing_notes: "Built by tools/combine.py from the per-event GeoParquet collections, with DuckDB (UNION ALL) and geoparquet-io (GeoParquet 2.0, no geometry repair, bbox column). `water_class` is the label decoded from the source geodatabase domain where one exists, else the raw text when the source column holds text labels. `water_class_code` is the raw value as text. Collections in EPSG:3857 or UTM were reprojected to EPSG:4326; Z values were dropped. Wide multi-epoch layers (one row per site, with columns `Main_Damage_Site_Class_2` to `_N`) take the highest-numbered epoch whose class is not null, and that epoch's date, sensor, and confidence; `assessment_epoch` records it (1 = the unnumbered columns). The row count equals the sum of the input collections."
known_issues: "Class labels are not normalized across events: UNOSAT's domains and text exports spell the same class in different ways (for example, Destroyed and Completely Destroyed), and some domains number classes differently. `water_class` is null where the source holds a numeric code with no domain to decode it (shapefile exports). A row's `license` is the license of its HDX dataset; a combined work under mixed licenses must meet each one, including share-alike for CC BY-SA rows. This collection has no PMTiles: tylertoo (git c338560) stalled single-threaded at zoom 3 for more than 15 minutes at both max zoom 12 and 10. Each event's own water-extent collection has tiles."
