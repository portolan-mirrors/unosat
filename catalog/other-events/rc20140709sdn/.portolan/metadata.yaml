description: "UNOSAT geodata for Event, Sudan, 9 July 2014 (RC20140709SDN), from 3 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\nThis map illustrates satellite-detected structures at the Shagarab 1 refugee camp in al Qadarif Province, Sudan as seen on 09 December 2013 by the WorldView-2 satellite. This camp lies about 70 km South-East of New Halfa and 105 km North-East of Al Qadarif city. UNOSAT analyzed a total of 6,242 structures in the 209 ha of the camp. This is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to UNITAR / UNOSAT.\n\nHDX datasets:\n\n- [Geodata of Shagarab 1 Refugee Camp, Al Qadarif Province, Sudan](https://data.humdata.org/dataset/geodata-of-shagarab-1-refugee-camp-al-qadarif-province-sudan-july-21-2014)\n- [Geodata of Shagarab 2 Refugee Camp, Al Qadarif Province, Sudan](https://data.humdata.org/dataset/geodata-of-shagarab-2-refugee-camp-al-qadarif-province-sudan-july-21-2014)\n- [Geodata of Um Gargour Refugee Camp, Al Qadarif Province, Sudan](https://data.humdata.org/dataset/geodata-of-um-gargour-refugee-camp-al-qadarif-province-sudan-july-21-2014)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
