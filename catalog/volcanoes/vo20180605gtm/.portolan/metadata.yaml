title: "Volcano, Guatemala, 5 June 2018 (VO20180605GTM)"
description: "UNOSAT geodata for Volcano, Guatemala, 5 June 2018 (VO20180605GTM), from 2 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\nEste mapa ilustra una estimación del número de viviendas y estructuras potencialmente afectadas por el flujo piroclástico detectado por Copernicus EMS, usando una imagen satélite Sentinel-2 colectada el 4 de junio 2018. UNITAR-UNOSAT ha estimado un total de 411 viviendas / estructuras que se encuentran dentro del área afectada por el flujo piroclástico; de las cuales 260 pertenecen a la aldea de San Miguel de Los Lotes. Complejos industriales y hoteleros como el de La Reunión se encuentran también dentro de la extensión del flujo piroclástico. Este análisis es preliminar y no ha sido validado en terreno. Por favor, envíen sus comentarios a UNITAR-UNOSAT.\n\nHDX datasets:\n\n- [Estimación del número de viviendas y estructuras dañadas en la aldea de San Miguel de Los Lotes y los alreadedores](https://data.humdata.org/dataset/estimacion-del-numero-de-viviendas-y-estructuras-danadas-en-la-aldea-de-san-miguel-de-los-lotes-y-)\n- [Volcano de Fuego: Estimation of damaged buildings in San Miguel de Los Lotes and surrouding area, Guatemala](https://data.humdata.org/dataset/volcano-de-fuego-estimation-of-damaged-buildings-in-san-miguel-de-los-lotes-and-surrouding-area-)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
