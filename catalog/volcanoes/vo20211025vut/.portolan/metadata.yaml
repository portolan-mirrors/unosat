description: "UNOSAT geodata for Volcano, Vanuatu, 25 October 2021 (VO20211025VUT), from 1 dataset on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code: VO20211025VUT**  This map illustrates the volcanic ashfall dispersion as observed using Sentinel-2 imagery acquired on  23 October 2021, 10:00 hrs. local time over Yasur volcano on Tanna Island, Vanuatu. At the time of the acquisition, the ashfall covered about 20 km2 at the Southwestern direction of the volcanic crater. Using the building footprints of Humanitarian Open Street Map as a baseline, around 440 buildings in the cloud free zone are located within areas covered by ash and smoke, representing 3% of the total number of buildings in Tanna island.\nThis is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to United Nations Satellite Centre (UNOSAT).\n\nHDX datasets:\n\n- [Potential ash deposit extent by Yasur Volcano, Tanna Island, Vanuatu as of 23 October 2021](https://data.humdata.org/dataset/potential-ash-deposit-extent-by-yasur-volcano-tanna-island-vanuatu-as-of-23-october-2021)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
