processing_notes: "Downloaded from HDX on 2026-11-22 and converted with GDAL ogr2ogr (to GeoPackage, multi-part geometry types, OGR_ORGANIZE_POLYGONS=CCW_INNER_JUST_AFTER_CW_OUTER) and geoparquet-io (GeoParquet 2.0, no geometry repair, bbox column added). Geometry is kept as published; no feature was repaired, dropped, or reprojected. Each layer's row count was checked against the source feature count. Layers merged with DuckDB `UNION ALL BY NAME`: a column a layer lacks is null for its rows. Coded geodatabase domains are decoded into `<field>_label` columns, per source file. Source layers: `LS8_20210601_LavaFlow_Goma_USGS`, `PHR_20210601_LavaFlow_Goma`, `SAOCOM1_20210527_LavaFlow_Goma`, `ST1_20210525_LavaFlow_Goma`, `ST1_20210525_PotentiallyAffectedStructures_Goma`, `ST1_20210525_ST2_20210601_PHR_20210601_LavaFlow_Goma`, `ST2_20210527_LavaFlow_Goma`, `ST2_20210601_Lavaflow_Goma`, `TSX_20210524_LavaFlow_Goma`, `TSX_20210524_PotentiallyAffectedStructures_Goma`."
known_issues: "HDX states the license as \"Creative Commons Attribution Share-Alike (CC BY-SA)\" with no version, so the collection's license is `other`, linked to the license definition HDX gives. This is a preliminary assessment and has not yet been validated in the field. It is important to consider the characteristics of the source imagery used in the analyses when interpreting results. For damage assessments it should be noted that only significant damage to the structural integrity of the buildings analyzed can be seen in imagery, while minor damage such as cracks or holes may not be visible at all. For flood extractions using radar data it is important to note that urban areas and highly vegetated areas may mask the flood signature and result in underestimation of flood waters. Users with specific questions or concerns should contact unosat@unitar.org to seek clarification."
