title: "Fire, Tunisia, 29 July 2021 (FR20210729TUN)"
description: "UNOSAT geodata for Fire, Tunisia, 29 July 2021 (FR20210729TUN), from 2 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code: FR20210729TUN**  Cette carte illustre la densité des foyers d'incendies détectés à partir des données VIIRS; ainsi que les zones d'incendies, observées à partir d'une image satellite Pleiades acquise le 29 juillet 2021 à 10:21 UTC, au sud-ouest de la ville de Ghardimaou.\nDans les gouvernorats de Jendouba et Le Kef, respectivement 135 et 114 foyers ont été détectés entre le 27 et le 29 juillet 2021.\nDans les 9,700 ha de zone analysée, environ 540 ha et 483 ha de végétation semblent avoir brûlé dans les délégations de Ghardimaou et Sakiet Sidi Youssef.\nCeci est une analyse préliminaire et n'a pas encore été validée sur le terrain. Ne pas hésiter à envoyer vos commentaires au Centre Satellitaire des Nations Unies (UNOSAT).\n\nHDX datasets:\n\n- [Impact des feux de forêts le 01 août 2021, gouvervorats de Jendouba et Le Kef, Tunisie](https://data.humdata.org/dataset/impact-des-feux-de-forets-le-01-aout-2021-gouvervorats-de-jendouba-et-le-kef-tunisie)\n- [Impact des feux de forêts le 29 juillet 2021, gouvervorats de Jendouba et Le Kef, Tunisie](https://data.humdata.org/dataset/impact-des-feux-de-forets-le-29-juillet-2021-gouvervorats-de-jendouba-et-le-kef-tunisie)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
