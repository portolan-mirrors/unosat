description: "UNOSAT geodata for Fire, Algeria, 11 August 2021 (FR20210811DZA), from 5 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code: FR20210811DZA**  Cette carte illustre la densité des foyers d'incendies détectés à partir des données VIIRS acquise entre le 11 et le 13 août 2021. Les wilayas de Bejaia, Tizi Ouzou et Ain-Defla semblent compter le plus grand nombre de foyers d'incendie avec respectivement 1,080; 573 et 190. En se basant sur les données démographique Worldpop, environ 70,000 personnes dans la wilaya de Tizi Ouzou; 25,000 personnes dans la wilaya de Bejaia et 13,000 personnes dans la wilaya de Skikda vivent à proximité des foyers d'incendie. Ceci est une analyse préliminaire et n'as pas encore été validée sur le terrain. Ne pas hésiter à envoyer vos commentaires au Centre Satellitaire des Nations Unies (UNOSAT).\n\nHDX datasets:\n\n- [Densité des foyers d'incendies dans les wilayas de Bejaia et Tizi Ouzou entre le 09 et le 16 août 2021](https://data.humdata.org/dataset/densite-des-foyers-d-incendies-dans-les-wilayas-de-bejaia-et-tizi-ouzou-entre-le-09-et-le-)\n- [Densité des foyers d'incendies dans les wilayas de Bejaia et Tizi Ouzou entre le 10 et le 12 août 2021](https://data.humdata.org/dataset/densite-des-foyers-d-incendies-dans-les-wilayas-de-bejaia-et-tizi-ouzou-entre-le-10-et-le-)\n- [Densité des foyers d'incendies dans les wilayas de Bejaia et Tizi Ouzou entre le 11 et le 13 août 2021](https://data.humdata.org/dataset/densite-des-foyers-d-incendies-dans-les-wilayas-de-bejaia-et-tizi-ouzou-entre-le-11-et-le-)\n- [Zones incendiées le 12 août 2021 dans les wilayas de Blida, Bouira et Medea, Algérie](https://data.humdata.org/dataset/zones-incendiees-le-12-aout-2021-dans-les-wilayas-de-blida-bouira-et-medea-algerie)\n- [Zones incendiées le 15 août 2021 dans la  commune d'El Amra, wilaya d'Ain-Defla, Algérie](https://data.humdata.org/dataset/zones-incendiees-le-15-aout-2021-dans-la-commune-d-el-amra-wilaya-d-ai