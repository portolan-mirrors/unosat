description: "UNOSAT geodata for Satellite Detected Waters in Savu Area, Naitasiri Province, Central Division, Fiji, from 1 dataset on the Humanitarian Data Exchange. HDX describes the event:\n\nThis map illustrates satellite-detected waters in Savu area, Naitasiri Province situated in the south of Viti Levu Island (Fiji). Using satellite imagery collected by RADARSAT-2 on 21 February 2016 and 08 April 2015, UNOSAT identified ~ 1,100 hectares of land to be potentially affected by waters. Most of the affected areas are agricultural fields located along the banks of River Rewa.\n\nHDX datasets:\n\n- [Satellite Detected Waters in Savu Area, Naitasiri Province, Central Division, Fiji](https://data.humdata.org/dataset/satellite-detected-waters-in-savu-area-naitasiri-province-central-division-fiji)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
