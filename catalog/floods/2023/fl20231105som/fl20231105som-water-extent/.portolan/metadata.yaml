processing_notes: "Downloaded from HDX on 2026-11-22 and converted with GDAL ogr2ogr (to GeoPackage, multi-part geometry types, OGR_ORGANIZE_POLYGONS=CCW_INNER_JUST_AFTER_CW_OUTER) and geoparquet-io (GeoParquet 2.0, no geometry repair, bbox column added). Geometry is kept as published; no feature was repaired, dropped, or reprojected. Each layer's row count was checked against the source feature count. Layers merged with DuckDB `UNION ALL BY NAME`: a column a layer lacks is null for its rows. Coded geodatabase domains are decoded into `<field>_label` columns, per source file. Source layers: `GF2_20231123_FloodExtent_BeledweyneCity_HiraanRegion`, `PHR_20231112_FloodExtent_BeledweyneCity_ShabelleRegion`, `PHR_20231112_WaterExtent_BeledweyneCity_ShabelleRegion`, `PHR_20231113_FloodExtent_Baardhere_GedoRegion`, `PHR_20231113_FloodExtent_BuaaleCity_MiddleJubaRegion`, `PHR_20231113_WaterExtent_BuaaleCity_MiddleJubaRegion`, `PHR_20231115_FloodExtent_JilibCity_MiddleJubaRegion`, `PHR_20231116_FloodExtent_LuuqCity_GedoRegion`, `PHR_20231116_WaterExtent_LuuqCity_GedoRegion`, `RCM_20231111FloodExtent_Jowhar_MiddleShabelleRegion`, `RCM_20231122_FloodExtent_Jowhar_MiddleShabelleRegion`, `S1_20231105_FloodExtent_Gedo_JubaRegion`, `S1_20231107_FloodExtent_Doolow_LuuqDistrict_GedoRegion`, `S1_20231107_FloodExtent_Gedo_JubaRegion`, `S1_20231107_WaterExtent_Doolow_LuuqDistrict_GedoRegion`, `S1_20231109_FloodExtent_Jowhar_MiddleShabelleRegion`, `S2_20231115_WaterExtent_AlongWebiShabelleRiver`, `S2_20231120_WaterExtent_Along_AlongWebiShabelleRiver`, `S2_20231120_WaterExtent_Jowhar_MiddleShabelleRegion`, `S2_20231203_FloodExtent_JubaHoose_JubaDhexeRegion`, `S2_20231203_WaterExtent_JubaHoose_JubaDhexeRegion`, `VIIRS_20231101_20231105_FloodExtent_SouthSomalia`, `VIIRS_20231128_20231202_FloodExtent_SouthSomalia`, `WV2_20231122_FloodExtent_JowharCity_MiddleShabelleRegion`, `WV2_20231124_FloodExtent_Jilib_Somalia`, `WV2_20231130_FloodExtent_BeledweyneCity_HiraanRegion`, `WV2_20231130_FloodEx