description: "UNOSAT geodata for Flood, Norway, 11 August 2023 (FL20230811NOR), from 3 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code FL20230811NOR**  ette kartet viser kumulativt satellittoppdaget overflatevann langs med Gudbrandsdalslågen i Ringebu, Sør-Fron og Nord-Fron kommune, Innlandet fylke, Norge, observert fra et Sentinel-1 bilde tatt den 10. august 2023 kl. 17:03 UTC.\nInnenfor det analyserte området på omtrent 500 km², er omtrent 15 km² med land observert som oversvømt. Basert på befolkningsdata fra Worldpop og det kartlagte overflatevannet er omtrent 800 personer potensielt eksponert eller bor i nærheten av det oversvømte områder.\nDette er en foreløpig analyse og er ennå ikke validert på feltet.\nVennligst send tilbakemelding fra bakken til FNs satellittsenter (UNOSAT).\n\nHDX datasets:\n\n- [Floods in Norway, August 2023 - UNOSAT Live Web Map](https://data.humdata.org/dataset/floods-in-norway-august-2023-unosat-live-web-map)\n- [Satellite detected water extent over Ringerike Municipality, Viken County, Norway as of 12 August 2023](https://data.humdata.org/dataset/water-extent-over-ringerike-municipality-viken-county-norway-as-of-12-august-2023)\n- [Satellittoppdaget overflatevann langs med Gudbrandsdalslågen, Ringebu, Sør-Fron og Nord-Fron Kommune, Innlandet Fylke, Norge](https://data.humdata.org/dataset/satellittoppdaget-overflatevann-langs-med-gudbrandsdalslagen-ringebu-sor-fron-og-nord-fron)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
