description: "UNOSAT geodata for Flood, Libya, 12 September 2023 (FL20230912LBY), from 11 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code FL20230912LBY, GDACS Id: 1102204**  On the night of the 10th of September 2023, after its journey through the Mediterranean Sea, the storm Daniel brought heavy rains that triggered floods in Benghazi, Almarj, Al Jabal Al Akhdar and Derna Governorates, in northeastern Libya. The increase of water levels in the region caused the collapse of two dams located upstream Derna River and the consequences was tremendous. The dam breach released a massive amount of water and a huge flood wave wiped out entire neighbourhoods in the city of Derna. Hundreds of people were reported missing by the Libyan Red Crescent Society.\nAccording to the Libyan National Meteorological Centre, the storm reached its peak with winds going up to 70-80 km/h. This led to the falling of electricity towers and tress causing communications interruption. Between 150 – 240 mm were reported and caused flash floods in several cities. Al-Bayda have recorded the highest daily rainfall rate: 414.1 mm in the night of the 10 to 11 September 2023.\n\nHDX datasets:\n\n- [10 September 2023 Mediterranean Sea Storm Daniel in Libya, Preliminary Satellite-Based Comprehensive Damage Assessment Report](https://data.humdata.org/dataset/10-september-2023-mediterranean-sea-storm-daniel-in-libya-preliminary-satellite-based-comp)\n- [Flood impact assessment in Al Tamimi Town, Derna Governorate, East Province, Libya](https://data.humdata.org/dataset/flood-impact-assessment-in-al-tamimi-town-derna-governorate-east-province-libya)\n- [Flood impact assessment in Dams over Benghazi and Almarj Governorates, East Province, Libya](https://data.humdata.org/dataset/flood-impact-assessment-in-dams-over-benghazi-and-almarj-governorates-east-province-libya)\n- [Flood impact assessment in Derna City centre, East Province, Libya](https://data.humdata.org/dataset/fl