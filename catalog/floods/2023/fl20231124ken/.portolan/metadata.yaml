description: "UNOSAT geodata for Flood, Kenya, 24 November 2023 (FL20231124KEN), from 3 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code: FL20231124KEN**  This map illustrates satellite-detected water extent in Dadaab Town, Dadaab County, Garissa Province, Kenya as observed from a Sentinel-2 image acquired on 26 November 2023 at 10:50 local time and a Landsat 9 image acquired on 21 November 2023 at 10:30 local time. Within analysed area of about 1,000 km², a total of about 110 km² of lands appear to be affected with flood waters. Furthermore, within the analysed area, about 4,600 buildings are identified as affected by the floods.\nThis is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to the United Nations Satellite Centre (UNOSAT).\n\nHDX datasets:\n\n- [Floods in Kenya, November 2023 - UNOSAT Live webmap](https://data.humdata.org/dataset/floods-in-kenya-november-2023-unosat-live-webmap)\n- [Satellite detected water extent in Dadaab Town, Dadaab  County, Garissa Province, Kenya as of 21 & 26 November 2023](https://data.humdata.org/dataset/water-extent-in-dadaab-town-dadaab-county-garissa-province-kenya-as-of-21-26-november-2023)\n- [Satellite detected water extent in Garissa City, Dujis County, Garissa Province, Kenya as of 26 November 2023](https://data.humdata.org/dataset/water-extent-in-garissa-city-dujis-county-garissa-province-kenya-as-of-26-november-2023)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
