description: "UNOSAT geodata for Flood, Algeria, 26 May 2023 (FL20230526DZA), from 2 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code FL20230526DZA, GDACS Id: 1102025**  Cette carte illustre l’étendue ainsi que l'impact des crues subite tels qu’observés à partir de l’image satellite Sentinel-2 acquise le 27 mai 2023 à 11:36 heure locale dans les communes de Khemisti, Bousmail et Bouharoun dans la wilaya de Tipaza en Algérie. Dans la zone analysée d’environs 12,000 ha, une zone d’une soixantaine d’hectares semble avoir subi des dégâts importants. Dans cette zone, UNOSAT a identifié 2 ports endommagés, 794 structures affectées et potentiellement affectées ainsi que 31 sections de routes ayant subi des dégâts.\nCeci est une analyse préliminaire et n'a pas encore été validée sur le terrain. Merci de bien vouloir adresser vos commentaires au Centre Satellitaire des Nations Unies (UNOSAT).\n\nHDX datasets:\n\n- [Flood impact analysis in Khemisti, Bou Ismail and Bouharoun Communes, Wilaya of Tipaza, Algeria  as of 27 May 2023](https://data.humdata.org/dataset/flood-impact-analysis-in-khemisti-bou-ismail-and-bouharoun-communes-wilaya-of-tipaza-alger)\n- [Impact des inondations du 25/26 mai 2023 dans les communes de Khemisti, Bousmail et Bouharoun, Wilaya de Tipaza, Algérie](https://data.humdata.org/dataset/impact-des-inondations-du-25-26-mai-2023-dans-les-communes-de-khemisti-bousmail-et-bouharo)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
