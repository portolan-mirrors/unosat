description: "UNOSAT geodata for Flood, Zambia, 31 January 2023 (FL20230131ZMB), from 2 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code FL20230131ZMB**  This map illustrates cumulative satellite-detected water using VIIRS in Southern, Lusaka, and Central Provinces, Zambia between 26 to 30 January 2023. Within the cloud free analyzed areas of about 20,000 km² and based on Worldpop spatial demographic data and the maximum flood water extent, about 80,000 people out of 800,000 are potentially exposed or living close to maximum floodwaters areas.\nThis is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to the United Nations Satellite Centre (UNOSAT).\n\nHDX datasets:\n\n- [Satellite detected water extents between 07 and 11 February 2023 in Zambia](https://data.humdata.org/dataset/satellite-detected-water-extents-between-07-and-11-february-2023-in-zambia)\n- [Satellite detected water extents between 26 and 30 January 2023 in Southern, Lusaka, and Central  Provinces, Zambia](https://data.humdata.org/dataset/water-extents-between-26-and-30-january-2023-in-southern-lusaka-and-central-provinces-zamb)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
