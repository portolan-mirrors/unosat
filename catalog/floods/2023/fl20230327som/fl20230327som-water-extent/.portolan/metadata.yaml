processing_notes: "Downloaded from HDX on 2026-11-22 and converted with GDAL ogr2ogr (to GeoPackage, multi-part geometry types, OGR_ORGANIZE_POLYGONS=CCW_INNER_JUST_AFTER_CW_OUTER) and geoparquet-io (GeoParquet 2.0, no geometry repair, bbox column added). Geometry is kept as published; no feature was repaired, dropped, or reprojected. Each layer's row count was checked against the source feature count. Layers merged with DuckDB `UNION ALL BY NAME`: a column a layer lacks is null for its rows. Coded geodatabase domains are decoded into `<field>_label` columns, per source file. Source layers: `JL_PHR_20230513_20230525_FloodExtent_Beledweyne_SOM`, `JL_PHR_20230525_FloodExtent_Beledweyne_SOM`, `PHR_20230529_20230530_WaterExtent_BuloBurto_SOM`, `PHR_20230603_WaterExtent_BuloBurto_SOM`, `S2_20230328_WaterExtent_ShabelleDistrict_ETH`, `S2_20230402_FloodExtent_ShabelleDistrict_ETH`, `S2_20230404_FloodExtent_Border_ETH_SOM`, `S2_20230409_FloodExtent_Border_ETH_SOM`, `S2_20230414_FloodExtent_Border_ETH_SOM`, `S2_20230419_FloodExtent_Booco`, `S2_20230419_FloodExtent_Border_ETH_SOM`, `S2_20230419_FloodExtent_Jowhar`, `S2_20230429_FloodExtent_Booco`, `S2_20230429_FloodExtent_Border_ETH_SOM`, `S2_20230429_FloodExtent_Jowhar`, `S2_20230514_WaterExtent_Border_ETH_SOM_Bocco`, `S2_20230519_WaterExtent_BeledweyneCity_Somalia`, `SP_20230330_WaterExtent_SouthernShabelleDistrict_ETH`, `VIIRS_20230523_FloodExtent_SOM`, `VIIRS_20230528_FloodExtent_SOM`."
known_issues: "HDX states the license as \"Creative Commons Attribution Share-Alike (CC BY-SA)\" with no version, so the collection's license is `other`, linked to the license definition HDX gives. This is a preliminary assessment and has not yet been validated in the field. It is important to consider the characteristics of the source imagery used in the analyses when interpreting results. For damage assessments it should be noted that only significant damage to the structural integrity of the buildings analyzed can be seen in imagery, while minor damage such as cracks or holes may not be visible at all. For flood extractions using radar data it is important to note that urban areas and highly vegetated areas may mask the flood signature and result in underestimation of flood waters. Users with specific questions or concerns should contact unosat@unitar.org to seek clarification."
