description: "UNOSAT geodata for Flood, Chad, 26 September 2017 (FL20170926TCD), from 1 dataset on the Humanitarian Data Exchange. HDX describes the event:\n\nThis map illustrates the satellite-detected surface water extent over D’joumane/Bongor and surroundings in Chad along the Logone River as observed from the Radarsat-2 SAR image acquired on 5 October 2017. The analysis of the image indicate that localized standing flood water with very little impact on population and agriculture area. Within the analyzed area (11,680 km2), 15,331 ha of surface water extent was observed of which 6667 ha in Chad and 8664 ha in Cameroon. This is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to UNITAR - UNOSAT.\n\nHDX datasets:\n\n- [Satellite Detected Surface Waters in D'joumane/Bongor areas, Chad](https://data.humdata.org/dataset/satellite-detected-surface-waters-in-d-joumane-bongor-areas-chad-2706)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
