description: "UNOSAT geodata for Flood, Sudan, 8 August 2016 (FL20160808SDN), from 13 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\nThis map illustrates satellite-detected possible flood water & saturated soil over Sennar State, extracted from Radarsar-2 imagery acquired 12 August 2016. UNOSAT has analysed the area using a Radarsat-2 image acquired on 12 August 2016 to identify and delineate the Possible Flood Water & Saturated / Wet Soil. According to satellite derived analysis some areas within Sennar State seem to be flooded. In addition, and the Blue Nile increased its size especially in the right bank, without apparently causing floods inside build up areas.The exact limit of flood waters is uncertain because of the low spatial resolution of the satellite data used for this analysis. Detected water bodies likely reflect an underestimation of all flood-affected areas within the map extent. This analysis has not yet been validated in the field. Please send ground feedback to UNITAR - UNOSAT.\n\nHDX datasets:\n\n- [Geodata of Evolution of Possible Flood Water & Saturated Soil Over Khartoum City, Khartoum State, Sudan](https://data.humdata.org/dataset/geodata-of-evolution-of-possible-flood-water-saturated-soil-over-khartoum-ci-august-18-2016)\n- [Geodata of Possible Flood Water & Saturated Soil Over Khartoum Area, Khartoum State, Sudan](https://data.humdata.org/dataset/geodata-of-possible-flood-water-saturated-soil-over-khartoum-area-khartoum-s-august-17-2016)\n- [Geodata of Possible Flood Water & Saturated Soil over Abu Hamad Area, River Nile State, Sudan](https://data.humdata.org/dataset/geodata-of-possible-flood-water-saturated-soil-over-abu-hamad-area-river-nil-august-19-2016)\n- [Geodata of Satellite Detected Waters Over Khartoum Area, Khartoum State, Sudan](https://data.humdata.org/dataset/geodata-of-satellite-detected-waters-over-khartoum-area-khartoum-state-sudan-august-12-2016)\n- [Geodata of Satellite Detected Waters over central