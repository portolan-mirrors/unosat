description: "UNOSAT geodata for Flood, Bangladesh, 25 July 2016 (FL20160725BGD), from 6 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\nThis map illustrates satellite-detected water extent and evolution in the eastern part of Bangladesh as imaged by the SENTINEL-1 satellite on 30 June 2016 and 24 July 2016. The analysis shows an expansion of waters of 75% between the two dates within the entire analyzed zone. Heavy rains at the onset of the Monsoon season have caused flooding. This is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to UNITAR-UNOSAT.\n\nHDX datasets:\n\n- [Geodata of Satellite Detected Water Extent and Evolution Over Central Bangladesh](https://data.humdata.org/dataset/geodata-of-satellite-detected-water-extent-and-evolution-over-central-banglad-july-27-2016)\n- [Geodata of Satellite Detected Water Extent and Evolution Over Eastern part of Bangladesh](https://data.humdata.org/dataset/geodata-of-satellite-detected-water-extent-and-evolution-over-eastern-part-of-july-28-2016)\n- [Geodata of Satellite Detected Waters Evolution in Central Bangladesh - Preliminary Report](https://data.humdata.org/dataset/geodata-of-satellite-detected-waters-evolution-in-central-bangladesh-prelimin-july-29-2016)\n- [Satellite Detected Water Extent and Evolution Over Central Bangladesh](https://data.humdata.org/dataset/satellite-detected-water-extent-and-evolution-over-central-bangladesh)\n- [Satellite Detected Water Extent and Evolution Over Eastern part of Bangladesh](https://data.humdata.org/dataset/satellite-detected-water-extent-and-evolution-over-eastern-part-of-bangladesh)\n- [Satellite Detected Waters Evolution in Central Bangladesh - Preliminary Report](https://data.humdata.org/dataset/satellite-detected-waters-evolution-in-central-bangladesh-preliminary-report)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
