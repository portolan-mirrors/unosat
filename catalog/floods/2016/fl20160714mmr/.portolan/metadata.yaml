description: "UNOSAT geodata for Flood, Myanmar, 14 July 2016 (FL20160714MMR), from 4 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\nThis map illustrates satellite-detected flood waters in the northwestern part of Rakhine State in the townships of Kyauktaw, Mrauk-U and Ponnagyun, Myanmar as imaged by the SENTINEL-1 satellite on 14 July 2016. Heavy rains at the onset of the monsoon season have caused flooding. The most affected lands seem to be mainly agricultural and/or paddy fields, many of which are of course frequently inundated at other times as well. This is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to UNITAR-UNOSAT.\n\nHDX datasets:\n\n- [Floods in Rakhine State, Myanmar-Situation Analysis Preliminary Report](https://data.humdata.org/dataset/floods-in-rakhine-state-myanmar-situation-analysis-preliminary-report)\n- [Geodata of Floods in Rakhine State, Myanmar-Situation Analysis Preliminary Report](https://data.humdata.org/dataset/geodata-of-floods-in-rakhine-state-myanmar-situation-analysis-preliminary-rep-august-03-2016)\n- [Geodata of Satellite Detected Waters Extent Over Northwestern Rakhine State, Myanmar](https://data.humdata.org/dataset/geodata-of-satellite-detected-waters-extent-over-northwestern-rakhine-state-m-july-15-2016)\n- [Satellite Detected Waters Extent Over Northwestern Rakhine State, Myanmar](https://data.humdata.org/dataset/satellite-detected-waters-extent-over-northwestern-rakhine-state-myanmar)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
