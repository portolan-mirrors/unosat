description: "UNOSAT geodata for Flood, South Sudan, 14 March 2022 (FL20220314SSD), from 1 dataset on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code: FL20220314SSD**  This map illustrates cumulative satellite-detected water using VIIRS in South Sudan between 10 to 14 March 2022 compared with the period from 05 to 09 March 2022. Within the cloud free analyzed areas of about 628,000 km2, a total of about 11,400 km2 of lands appear to be affected with flood waters. Water extent appears to have decreased about 12,000 km2 since the period between 05  to 09 March 2022. Based on Worldpop population data and the maximal flood water coverage, ~277,000 people are potentially exposed or living close to flooded areas.\nThis is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to the United Nations Satellite Centre (UNOSAT).\n\nHDX datasets:\n\n- [Satellite detected water extents between 10 and 14 March 2022 over South Sudan](https://data.humdata.org/dataset/satellite-detected-water-extents-between-10-and-14-march-2022-over-south-sudan)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
