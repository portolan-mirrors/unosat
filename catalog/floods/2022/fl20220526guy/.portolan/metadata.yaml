description: "UNOSAT geodata for Flood, Guyana, 26 May 2022 (FL20220526GUY), from 2 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code: FL20220526GUY**  This map illustrates cumulative satellite-detected water using VIIRS in Guyana between 25 to 29 May 2022 compared with the period from 20 to 24 May 2022. Within the cloud free analyzed areas of about 205,000 km2, a total of about 3,900 km2 of lands appear to be affected with flood waters. Water extent appears to have increased of about 1,200 km2 since the period between 20 to 24 may 2022. Based on Worldpop population data and the maximal flood water coverage, ~22,000 people are potentially exposed or living close to flooded areas.\nThis is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to the United Nations Satellite Centre (UNOSAT).\n\nHDX datasets:\n\n- [Satellite detected water extent along the Rupununi river, Upper Takutu-Upper Essequibo, Guyana as of 26 May 2022](https://data.humdata.org/dataset/water-extent-along-the-rupununi-river-upper-takutu-upper-essequibo-guyana-as-of-26-may-202)\n- [Satellite detected water extent between 25 and 29 May 2022 over Guyana](https://data.humdata.org/dataset/satellite-detected-water-extent-between-25-and-29-may-2022-over-guyana)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
