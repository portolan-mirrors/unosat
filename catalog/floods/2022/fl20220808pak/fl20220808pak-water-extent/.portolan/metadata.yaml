processing_notes: "Downloaded from HDX on 2026-11-22 and converted with GDAL ogr2ogr (to GeoPackage, multi-part geometry types, OGR_ORGANIZE_POLYGONS=CCW_INNER_JUST_AFTER_CW_OUTER) and geoparquet-io (GeoParquet 2.0, no geometry repair, bbox column added). Geometry is kept as published; no feature was repaired, dropped, or reprojected. Each layer's row count was checked against the source feature count. Layers merged with DuckDB `UNION ALL BY NAME`: a column a layer lacks is null for its rows. Coded geodatabase domains are decoded into `<field>_label` columns, per source file. Source layers: `LS8_20220829_FloodExtent_Punjab_Sindh`, `LS8_20220829_WaterExtent_Punjab_Sindh`, `S1_20220806_FloodExtent_Sindh`, `S1_20220806_WaterExtent_Sindh`, `S1_20220815_FloodExtent_SindhProvince`, `S1_20220815_WaterExtent_SindhProvince`, `S1_20220827_FloodExtent_Sindh_Balochistan`, `S2_20220831_FloodExtent_Sindh`, `S2_20220831_WaterExtent_Sindh`, `Terra_Modis_20100827_FloodExtent_PAK`, `Terra_Modis_20220827_20220828_FloodExtent_PAK`, `VIIRS_20220701_20220831_FloodExtent_PAK`, `VIIRS_20220712_20220721_FloodExtent_PAK`, `VIIRS_20220801_20220829_FloodExtent_PAK`, `VIIRS_20220801_20220831_FloodExtent_PAK`, `VIIRS_20220803_20220823_FloodExtent_PAK`, `VIIRS_20220825_20220831_FloodExtent_PAK`, `VIIRS_20220901_20220907_FloodExtent_PAK`, `VIIRS_20220908_20220914_FloodExtent_PAK`, `VIIRS_20220915_20220921_FloodExtent_PAK`, `VIIRS_20220926_20221002_FloodExtent_PAK`, `VIIRS_20221003_20221009_FloodExtent_PAK`, `VIIRS_20221011_20221017_FloodExtent_PAK`."
known_issues: "HDX states the license as \"Creative Commons Attribution Share-Alike (CC BY-SA)\" with no version, so the collection's license is `other`, linked to the license definition HDX gives. This is a preliminary assessment and has not yet been validated in the field. It is important to consider the characteristics of the source imagery used in the analyses when interpreting results. For damage assessments it should be noted that only significant damage to the structural integrity of the buildings analyzed can be seen in imagery, while minor damage such as cracks or holes may not be visible at all. For flood extractions using radar data it is important to note that urban areas and highly vegetated areas may mask the flood signature and result in underestimation of flood waters. Users with specific questions or concerns should contact unosat@unitar.org to seek clarification."
