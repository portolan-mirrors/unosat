description: "UNOSAT geodata for Flood, South Sudan, 19 January 2022 (FL20220119SSD), from 4 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code: FL20220119SSD**  This map illustrates cumulative satellite-detected water using VIIRS in South Sudan between 15 to 19 Jan. 2022 compared with the period between 10 to 14 Jan. 2022. Within the cloud free analyzed areas of about 625,000 km2, a total of about 31,500 km2 of lands appear to be affected with flood waters. Water extent appears to have decreased of about 1,300 km2 since the period between 10\nto 14 Jan. 2022.\nBased on Worldpop population data and the maximal flood water coverage, ~755,000 people are potentially exposed or living close to flooded areas.\nThis is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to the United Nations Satellite Centre (UNOSAT).\n\nHDX datasets:\n\n- [Satellite detected water extents between 11 and 15 February 2022 over South Sudan](https://data.humdata.org/dataset/satellite-detected-water-extents-between-11-and-15-february-2022-over-south-sudan)\n- [Satellite detected water extents between 15 and 19 January 2022 over South Sudan](https://data.humdata.org/dataset/satellite-detected-water-extents-between-15-and-19-january-2022-over-south-sudan)\n- [Satellite detected water extents between 23 and 27 February 2022 over South Sudan](https://data.humdata.org/dataset/satellite-detected-water-extents-between-23-and-27-february-2022-over-south-sudan)\n- [Satellite detected water extents between 4 and 8 February 2022 over South Sudan](https://data.humdata.org/dataset/satellite-detected-water-extents-between-4-and-8-february-2022-over-south-sudan)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
