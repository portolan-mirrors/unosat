description: "UNOSAT geodata for Flood, Bolivia (Plurinational State of), 13 February 2014 (FL20140213BOL), from 3 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\nEste mapa representa áreas inundadas detectadas por satélite en los alrededores de la ciudad de Riberalta, en el departamento de Beni, Bolivia, usando datos de TerraSAR-X obtenidos el 13 de Febrero de 2014. Las signaturas de agua han sido detectadas principalmente en los alrededores de la ciudad, no habiéndose observado masas de agua en el interior de la misma. Es probable que la extensión de las inundaciones haya sido infra estimada a lo largo de las zonas construidas, dadas las especiales características de la imagen de satélite utilizada. Este es un análisis preliminar que aún no ha sido validado en el terreno. Por favor envien sus comentarios a UNITAR /UNOSAT.\n\nHDX datasets:\n\n- [Geodata of Inundaciones en Riberalta, Departamento de Beni, Bolivia](https://data.humdata.org/dataset/geodata-of-inundaciones-en-riberalta-departamento-de-beni-bolivia-march-12-2014)\n- [Geodata of Inundaciones en Trinidad, Departamento de Beni, Bolivia](https://data.humdata.org/dataset/geodata-of-inundaciones-en-trinidad-departamento-de-beni-bolivia-march-12-2014)\n- [Geodata of Inundaciones en Trinidad, Departamento de Beni, Bolivia](https://data.humdata.org/dataset/geodata-of-inundaciones-en-trinidad-departamento-de-beni-bolivia-march-21-2014)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
