description: "UNOSAT geodata for Flood, Zimbabwe, 7 February 2014 (FL20140207ZWE), from 3 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\nThis map illustrates water bodies at the Tokwe Mukorsi Dam, Masvingo Province, Zimbabwe, as detected by TerraSAR-X on 11 February 2014. The flooded area above the dam has greatly increased due to recent heavy rains and currently encompasses about 2,300 ha. Using a WorldView-1 image acquired on 2 January 2012, UNOSAT located a total of 751 structures in 143 homestead locations that would be submerged by the current flood water extent. It is likely that flood waters have been systematically underestimated along highly vegetated areas along main river banks because of the special characteristics of the satellite data used. This analysis has not yet been validated in the field. Please send ground feedback to UNITAR /UNOSAT.\n\nHDX datasets:\n\n- [Geodata of Flood Water over Tokwe Mukorsi Dam, Masvingo Province, Zimbabwe](https://data.humdata.org/dataset/geodata-of-flood-water-over-tokwe-mukorsi-dam-masvingo-province-zimbabwe-february-11-2014)\n- [Geodata of Submerged Homesteads At Tokwe Mukorsi Dam, Masvingo Province, Zimbabwe](https://data.humdata.org/dataset/geodata-of-submerged-homesteads-at-tokwe-mukorsi-dam-masvingo-province-zimbab-february-13-2014)\n- [Geodata of Update: Flood Water over Tokwe Mukorsi Dam, Masvingo Province, Zimbabwe](https://data.humdata.org/dataset/geodata-of-flood-water-over-tokwe-mukorsi-dam-masvingo-province-zimbabwe-february-19-2014)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
