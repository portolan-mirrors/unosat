description: "UNOSAT geodata for Flood, Pakistan, 10 September 2014 (FL20140910PAK), from 5 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\nThis map illustrates satellite-detected areas of flood affected land as detected by LANDSAT-8 imagery acquired 10 September 2014 in Wazirabad area, Punjab Province (Pakistan). The area along Chenab River and agricultural areas northern Wazirabad are most likely inundated by floods caused by monsoon rains. It is likely that flood waters have been systematically underestimated because of the cloud coverage on the image. This analysis has not yet been validated in the field. Please send ground feedback to UNITAR /UNOSAT.\n\nHDX datasets:\n\n- [Geodata of Flood Waters in Chiniot Area, Punjab Province, Pakistan](https://data.humdata.org/dataset/geodata-of-flood-waters-in-chiniot-area-punjab-province-pakistan-september-16-2014)\n- [Geodata of Overview of Flood Waters in Multan area, Punjab Province, Pakistan](https://data.humdata.org/dataset/geodata-of-overview-of-flood-waters-in-multan-area-punjab-province-pakistan-september-15-2014)\n- [Geodata of Overview of Flood Waters in Puran-Fatehpur area, Punjab Province, Pakistan](https://data.humdata.org/dataset/geodata-of-overview-of-flood-waters-in-puran-fatehpur-area-punjab-province-pa-september-12-2014)\n- [Geodata of Overview of Flood Waters in Wazirabad area, Punjab Province, Pakistan](https://data.humdata.org/dataset/geodata-of-overview-of-flood-waters-in-wazirabad-area-punjab-province-pakista-september-11-2014)\n- [Geodata of Standing Waters in Tarind Muhammed Panah  Area, Punjab Province, Pakistan](https://data.humdata.org/dataset/geodata-of-standing-waters-in-tarind-muhammed-panah-area-punjab-province-paki-september-17-2014)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
