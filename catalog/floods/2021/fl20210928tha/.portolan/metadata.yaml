description: "UNOSAT geodata for Flood, Thailand, 28 September 2021 (FL20210928THA), from 9 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code: FL20210928THA**  This map illustrates satellite-detected surface waters in Khon Kaen, Chaiyaphum, Nakhon Ratchasima, and Nong Bua Lam Phu provinces, Thailand as observed from a Sentinel-1 image acquired on 5 Oct 2021 at 18:20 local time and using an automated analysis with Machine learning method.\nWithin the analyzed area of about 40,500 km2 , about 770 km2 of lands appear to be flooded. The water extent appears to have decreased of about 70 km2 since 29 September 2021.\nBased on Worldpop population data and the detected surface waters in the analyzed area, the potentially exposed population is mainly located in the district of Phimai with ~ 10,400 people, Non Sung with ~ 9,000 people, Mueang Chaiyaphum with ~ 6,700 people, Mueang Khon Kaen with ~ 4,500 people, and Chonnabot Thai with ~ 4,300 people.\nThis is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to United Nations Satellite Centre (UNOSAT).\nImportant note: Flood analysis from radar images may underestimate the presence of standing waters in built-up areas and densely vegetated areas due to backscattering properties of the radar signal.\n\nHDX datasets:\n\n- [Preliminary Satellite-Derived Flood Assessment, Central and Western Part of Thailand](https://data.humdata.org/dataset/preliminary-satellite-derived-flood-assessment-central-and-western-part-of-thailand)\n- [Preliminary satellite-derived flood assessment in Lower Northeastern Part of Thailand as of 11 November 2021](https://data.humdata.org/dataset/preliminary-satellite-derived-flood-assessment-in-lower-northeastern-part-of-thailand-as-o)\n- [Satellite detected water extents in Central and Western parts, Thailand as of 21 October 2021](https://data.humdata.org/dataset/water-extents-in-central-and-western-parts-thailand-as-of-21