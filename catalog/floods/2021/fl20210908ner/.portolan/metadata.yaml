description: "UNOSAT geodata for Flood, Niger, 8 September 2021 (FL20210908NER), from 4 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code: FL20210908NER**  This map illustrates the extent of surface waters (cumulative) in Dosso, Niamey, Tahoua and Tillaberi regions of Niger as detected by VIIRS-NOAA satellite between the 2nd of August & the 5th of September 2021. Within the analyzed cloud free zones of about 260,000 km2, a total of about 900 km2 of lands appear to be flooded. Based on Worldpop population data and the detected surface waters, about 120,000 people are potentially exposed or living close to flooded areas. The potentially exposed population is mainly located in the region of Dosso with ~40,000 people, Tillabéri with ~40,000 people and Tahoua with ~22,200 people.\nThis is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to United Nations Satellite Centre (UNOSAT).\n\nHDX datasets:\n\n- [Satellite detected water extent as of 05 August 2021 in Aderbissinat & Tchirozerine departments, Agadez Region, Niger](https://data.humdata.org/dataset/water-extent-as-of-05-august-2021-in-aderbissinat-tchirozerine-departments-agadez-region-n)\n- [Satellite detected water extent as of 09 September 2021 in Guidan Roumdji and Ville de Maradi departments, Niger](https://data.humdata.org/dataset/water-extent-as-of-09-september-2021-in-guidan-roumdji-and-ville-de-maradi-departments-nig)\n- [Satellite detected water extents between 2nd Aug. & 5th of Sep. 2021  in Dosso, Niamey and Tillaberi regions of Niger](https://data.humdata.org/dataset/water-extents-between-2nd-aug-5th-of-sep-2021-in-dosso-niamey-and-tillaberi-regions-of-nig)\n- [Satellite detected water extents between 3 & 7 of September 2021 in Dosso, Niamey, Tahoua and Tillaberi regions of Niger](https://data.humdata.org/dataset/water-extents-between-3-7-of-september-2021-in-dosso-niamey-tahoua-and-tillaberi-regions-o)\n\nRead [AGENTS.md]