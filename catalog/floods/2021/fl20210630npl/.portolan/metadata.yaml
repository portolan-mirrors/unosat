description: "UNOSAT geodata for Flood, Nepal, 30 June 2021 (FL20210630NPL), from 7 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code: FL20210630NPL**  This map illustrates satellite-detected surface waters in Nawalparasi West, Rupandehi and Kapilbastu districts, Lumbini province, Nepal as observed from a Sentinel-1 image acquired on 7 July 2021 at 06:12 local time and using an automated analysis with Machine learning method. Within the analyzed area of about 1,500 km2 and, about 67km2 of lands appear to be flooded. The water extent appears to have decreased of about 110 km2 since 2 July 2021 and moved toward India. Based on Worldpop population data and the detected surface waters in the analyzed area, the potentially exposed population is mainly located in the district of Rupandehi with ~59,000 people and Nawalparasi West with ~5,200 people.\nThis is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to United Nations Satellite Centre (UNOSAT).\nImportant note: Flood analysis from radar images may underestimate the presence of standing waters in built-up areas and densely vegetated areas due to backscattering properties of the radar signal.\n\nHDX datasets:\n\n- [Landslides impact analysis in Melamchi Municipality, Bagmati province, Nepal as of 24 June 2021](https://data.humdata.org/dataset/landslides-impact-analysis-in-melamchi-municipality-bagmati-province-nepal-as-of-24-june-2)\n- [Satellite detected water extent over Kaski and Syangja districts, Gandaki province, Nepal as of 4 July 2021](https://data.humdata.org/dataset/water-extent-over-kaski-and-syangja-districts-gandaki-province-nepal-as-of-4-july-2021)\n- [Satellite detected water extent over Nawalparasi West, Rupandehi and Kapilbastu districts, Nepal as of 7 July 2021](https://data.humdata.org/dataset/water-extent-over-nawalparasi-west-rupandehi-and-kapilbastu-districts-nepal-as-of-7-july-2)\n- [Satellite detected water extent