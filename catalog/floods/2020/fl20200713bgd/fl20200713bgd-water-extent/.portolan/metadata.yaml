processing_notes: "Downloaded from HDX on 2026-11-22 and converted with GDAL ogr2ogr (to GeoPackage, multi-part geometry types, OGR_ORGANIZE_POLYGONS=CCW_INNER_JUST_AFTER_CW_OUTER) and geoparquet-io (GeoParquet 2.0, no geometry repair, bbox column added). Geometry is kept as published; no feature was repaired, dropped, or reprojected. Each layer's row count was checked against the source feature count. Layers merged with DuckDB `UNION ALL BY NAME`: a column a layer lacks is null for its rows. Coded geodatabase domains are decoded into `<field>_label` columns, per source file. Source layers: `NOAA_20200712_20200721_FloodExtent_Bangladesh`, `NOAA_20200723_20200727_FloodExtent_Bangladesh`, `NOAA_20200729_20200802_FloodExtent_Bangladesh`, `ST1_20200709_FloodExtent_Northwestern`, `ST1_20200709_WaterExtent_Northwestern`, `ST1_20200713_FloodExtent_Bangladesh`, `ST1_20200713_FloodExtent_Mymensingh_Rajshahi_Rangpur`, `ST1_20200713_WaterExtent_Bangladesh`, `ST1_20200713_WaterExtent_Mymensingh_Rajshahi_Rangpur`, `ST1_20200720_FloodExtent_NE_Bangladesh`, `ST1_20200720_WaterExtent_NE_Bangladesh`, `ST1_20200721_FloodExtent_CentralRegion`, `ST1_20200721_FloodExtent_Northwestern`, `ST1_20200808_FloodExtent_Central_Northern`, `TDX_20200719_FloodExtent_NE_Bangladesh`, `TDX_20200719_WaterExtent_NE_Bangladesh`, `TSX_20200718_FloodExtent_E_Sylhet`, `TSX_20200718_FloodExtent_Mymensingh_Rajshahi_Rangpur`, `TSX_20200718_WaterExtent_E_Sylhet`, `TSX_20200718_WaterExtent_Mymensingh_Rajshahi_Rangpur`."
known_issues: "HDX states the license as \"Creative Commons Attribution Share-Alike (CC BY-SA)\" with no version, so the collection's license is `other`, linked to the license definition HDX gives. This is a preliminary assessment and has not yet been validated in the field. It is important to consider the characteristics of the source imagery used in the analyses when interpreting results. For damage assessments it should be noted that only significant damage to the structural integrity of the buildings analyzed can be seen in imagery, while minor damage such as cracks or holes may not be visible at all. For flood extractions using radar data it is important to note that urban areas and highly vegetated areas may mask the flood signature and result in underestimation of flood waters. Users with specific questions or concerns should contact unosat@unitar.org to seek clarification."
