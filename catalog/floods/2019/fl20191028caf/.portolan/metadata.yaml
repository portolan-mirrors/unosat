description: "UNOSAT geodata for Flood, Central African Republic, 28 October 2019 (FL20191028CAF), from 7 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code: FL20191028CAF**  This map illustrates satellite-detected water surface in Central African Republic and Democratic Republic of The Congo as observed from Sentinel-1 imagery acquired on 18 November 2019. Within the analysed extent of about 760 km2, a total about 6 km2 of land appear to be flooded in Basse-Kotto Prefecture of Central African Republic and about 1 km2 of land appear to be flooded in Nord-Ubangi Province of Democratic Republic of The Congo. This is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to UNITAR - UNOSAT.\nImportant note: Flood analysis from SAR Sentinel-1 images may significantly underestimate the presence of standing waters in built up and/or densely vegetated areas due to backscattering of the radar signal.\n\nHDX datasets:\n\n- [Satellite detected waters extents, as of 17 November 2019 over Basse-Kotto Prefecture of Central African Republic](https://data.humdata.org/dataset/waters-extents-as-of-17-november-2019-over-basse-kotto-prefecture-of-central-african-repub)\n- [Satellite detected waters extents, as of 17 November 2019 over Ouaka Prefecture of Central African Republic](https://data.humdata.org/dataset/waters-extents-as-of-17-november-2019-over-ouaka-prefecture-of-central-african-republic)\n- [Satellite detected waters extents, as of 17 November 2019 over Ouaka and Basse-Kotto, Central African Republic](https://data.humdata.org/dataset/waters-extents-as-of-17-november-2019-over-ouaka-and-basse-kotto-central-african-republic)\n- [Satellite detected waters extents, as of 18 November 2019 over Basse-Kotto Prefecture-CAR and Nord-Ubangi Province-DRC](https://data.humdata.org/dataset/waters-extents-as-of-18-november-2019-over-basse-kotto-prefecture-car-and-nord-ubangi-prov)\n- [Satellite detected waters e