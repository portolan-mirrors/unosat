description: "UNOSAT geodata for Flood, Myanmar, 15 July 2019 (FL20190715MMR), from 3 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code: FL20190715MMR**  This map illustrates the cumulative satellite detected surface waters in Mandalay and Saigang States, Myanmar by using a Sentinel-1 images acquired on 16 and 18 July 2019. Over an area of about 450km2 of lands appear to be likely flooded. By using the population data from Worldpop, total of about 185,000 people appear to have been affected by floods as of 18 July 2019. This is preliminary analysis that has not yet been validated in the field. Please send your comments to UNITAR-UNOSAT.\n\nHDX datasets:\n\n- [Satellite detected water extent, as of 16 and 18 July 2019 over Kachin and Saigang States, Myanmar](https://data.humdata.org/dataset/water-extent-as-of-16-and-18-july-2019-over-kachin-and-saigang-states-myanmar)\n- [Satellite detected water extent, as of 16 and 18 July 2019 over Kachin state,  Myanmar](https://data.humdata.org/dataset/satellite-detected-water-extent-as-of-16-and-18-july-2019-over-kachin-state-myanmar)\n- [Satellite detected water extent, as of 16 and 18 July 2019 over Mandalay and Saigang States, Myanmar](https://data.humdata.org/dataset/water-extent-as-of-16-and-18-july-2019-over-mandalay-and-saigang-states-myanmar)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
