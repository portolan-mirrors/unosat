description: "UNOSAT geodata for Flood, Congo, 5 December 2019 (FL20191205COG), from 2 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code: FL20191205COG**  This map illustrates satellite-detected waters in Epéna District, Likouala Department in Republic of Congo, as observed from Sentinel-1 imagery acquired on 10 December 2019. Within the analysed area of about 30,500 km2, based on Worldpop population data and the detected surface waters, about 7,000 people are potentially exposed or living close to flooded areas. This is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to UNITAR - UNOSAT.\nImportant note: Flood analysis from SAR Sentinel-1 images may significantly underestimate the presence of standing waters in built up and/or densely vegetated areas due to backscattering of the radar signal.\n\nHDX datasets:\n\n- [Satellite-detected flood waters, as of 29 November 2019, over Loukoléla, Cuvette Department, Republic of Congo](https://data.humdata.org/dataset/flood-waters-as-of-29-november-2019-over-loukolela-cuvette-department-republic-of-congo)\n- [Satellite-detected water extents, as of 10 December 2019, over Epéna District, Likouala  Department, Republic of Congo](https://data.humdata.org/dataset/water-extents-as-of-10-december-2019-over-epena-district-likouala-department-republic-of-c)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
