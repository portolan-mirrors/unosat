description: "UNOSAT geodata for Flood, Malaysia, 17 December 2019 (FL20191217MYS), from 2 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code: FL20191217MYS**  This map illustrates satellite-detected surface water in Kluang and Mersing District, Johor State and Rompin District, Pahang State of Malaysia as observed from Sentinel-1 imagery acquired on 15 December 2019. Within the analysed extent of about 3,500 km2, a total about 23 km2 of land appear to be flooded. This is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to UNITAR - UNOSAT.\nImportant Note: Flood analysis from Sentinel-1 imagery acquired on 15 December 2019 may seriously underestimate the presence of standing floodwater in built-up areas due to backscattering of the radar signal\n\nHDX datasets:\n\n- [Satellite detected waters extents, as of 15 December 2019 over Kota Tinggi and Mersing District, Johor State of Malaysia](https://data.humdata.org/dataset/waters-extents-as-of-15-december-2019-over-kota-tinggi-and-mersing-district-johor-state-of)\n- [Satellite detected waters extents, as of 15 December 2019 over Pahang State of Malaysia](https://data.humdata.org/dataset/satellite-detected-waters-extents-as-of-15-december-2019-over-pahang-state-of-malaysia)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
