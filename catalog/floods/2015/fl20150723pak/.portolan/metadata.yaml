description: "UNOSAT geodata for Flood, Pakistan, 23 July 2015 (FL20150723PAK), from 4 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\nThis map illustrates satellite-detected areas of flood as seen in Sentinel-1 imagery acquired on 11 August 2015 in northern Sindh state, Pakistan. There is significant flooding along the Indus river banks in Ghotki, Sukkur, Shirakpur, Larkana and Khairpur districts. In the analyzed area about 350,000 hectares of land were found to be flooded. It is likely that flood waters have been systematically underestimated along highly vegetated areas along main river banks and within built-up urban areas because of the special characteristics of the satellite data used. This analysis has not yet been validated in the field. Please send ground feedback to UNITAR-UNOSAT.\n\nHDX datasets:\n\n- [Geodata of Overview Of Flood Waters In Lahore Area, Punjab Province (Pakistan)](https://data.humdata.org/dataset/geodata-of-overview-of-flood-waters-in-lahore-area-punjab-province-pakistan-july-30-2015)\n- [Geodata of Overview Of Flood Waters In Sukkur District, Sindh Province, Pakistan](https://data.humdata.org/dataset/geodata-of-overview-of-flood-waters-in-sukkur-district-sindh-province-pakista-august-13-2015)\n- [Geodata of Overview of Flood Waters Near City of Moro in Sindh Province, Pakistan](https://data.humdata.org/dataset/geodata-of-overview-of-flood-waters-near-city-of-moro-in-sindh-province-pakis-august-18-2015)\n- [Geodata of Overview of Flood Waters in Mangla Area, and Northern Punjab (Pakistan)](https://data.humdata.org/dataset/geodata-of-overview-of-flood-waters-in-mangla-area-and-northern-punjab-pakist-july-29-2015)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
