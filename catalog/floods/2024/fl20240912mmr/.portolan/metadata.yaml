description: "UNOSAT geodata for Flood, Myanmar, 12 September 2024 (FL20240912MMR), from 3 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code: FL20240912MMR**  This map illustrates aggregated satellite detected floods using Sentinel-1 images acquired on 03 to 20 September 2024 using an automated analysis with a machine learning method. Within the analysed area of about 80,000 km², a total of about 5,100 km² of land appears to be affected by flood waters and about 4,500 km² of cropland appears to be inundated. Based on Worldpop spatial demographic data, about 760,000 people are exposed or living close to flooded areas.\nThis is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to the United Nations Satellite Centre (UNOSAT).\nImportant note: Flood analysis from radar images may underestimate the presence of standing waters in built-up areas and densely vegetated areas due to the backscattering properties of the radar signal.\n\nHDX datasets:\n\n- [Flood Impact Assessment in North Taungoo, Bago State, Myanmar as of 02 October 2024](https://data.humdata.org/dataset/flood-impact-assessment-in-north-taungoo-bago-state-myanmar-as-of-02-october-2024)\n- [Satellite detected water  extents in Mandalay,  Kayah, Shan (South), Nay  Pyi Taw, Bago (Est), Mon  and Kayin States,  Myanmar as of 03 & 23  September 2024](https://data.humdata.org/dataset/water-extents-in-mandalay-kayah-shan-south-nay-pyi-taw-bago-est-mon-and-kayin-states-myanm)\n- [Satellite detected water  extents in central part  of Myanmar as of 15  September 2024](https://data.humdata.org/dataset/satellite-detected-water-extents-in-central-part-of-myanmar-as-of-15-september-2024)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
