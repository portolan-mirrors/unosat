description: "UNOSAT geodata for Flood, Armenia, 28 May 2024 (FL20240528ARM), from 2 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code: FL20240528ARM, GDACS ID: 1102647**  This map illustrates satellite based structure damage assessment along the Debed river in Tashir, Stepanavan and Tumanian Municipalities, Lori Province as observed from a SPOT 6 imagery acquired on the 03 June 2024 at 14:35 local time & a Pléiades imagery acquired on the 29 May 2024 at 11:39 local time. UNOSAT observed 124 potentially affected buildings, 18 potentially affected bridges, 29 potentially affected road segments and 9 potentially affected railway segments. Based on Worldpop population data and within the analysed area, about 7,500 people live within 200m from the Debed river.\nThis is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to the United Nations Satellite Centre (UNOSAT).\n\nHDX datasets:\n\n- [Damage assessment along the Debed river in Tashir, Stepanavan & Tumanian Municipalites, Lori Province, Armenia as of 03 June 2024](https://data.humdata.org/dataset/damage-assessment-along-the-debed-river-in-tashir-stepanavan-tumanian-municipalites-lori-p)\n- [Damage assessment along the Debed river in Tumanian Municipality, Lori Province, Armenia as of 29 May 2024](https://data.humdata.org/dataset/damage-assessment-along-the-debed-river-in-tumanian-municipality-lori-province-armenia-as-)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
