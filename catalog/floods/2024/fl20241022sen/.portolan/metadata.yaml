description: "UNOSAT geodata for Flood, Senegal, 22 October 2024 (FL20241022SEN), from 4 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code: FL20241022SEN**  Cette carte illustre l'étendue des eaux d'inondations détectées par satellite en utilisant une image optique Sentinel-2 acquise le 20 octobre 2024 dans les départements de Matam et Kanel, Région de Matam. Dans la zone analysée d'environ 2,700 km², un total d'environ 500 km² de terres semblent être inondées. D'après les données démographique de Worldpop et les eaux d'inondations détectées par imagerie satellite, environ 45,000 personnes sont potentiellement exposées ou vivent à proximité de zones inondées.\nD'après les prévisions de débit du 24 octobre 2024 provenant de l'ECMWF à la station hydrométrique Senegal A Matam le long du fleuve Sénégal, le débit moyen actuel a tendance à diminuer au cours des 10 prochains jours.\nPrière de bien vouloir noter que ceci est une analyse préliminaire qui n'a pas été validée sur le terrain. Merci d'envoyer vos commentaires au Centre Satellitaire des Nations Unies (UNOSAT).\n\nHDX datasets:\n\n- [Eaux d'inondations détectées par satellite le 20 octobre 2024 dans les départements de Matam et Kanel, Sénégal](https://data.humdata.org/dataset/eaux-d-inondations-detectees-par-satellite-le-20-octobre-2024-dans-les-departements-de-mat)\n- [Eaux d'inondations détectées par satellite le 25 octobre 2024 dans les départements de Matam et Kanel, Sénégal](https://data.humdata.org/dataset/eaux-d-inondations-detectees-par-satellite-le-25-octobre-2024-dans-les-departements-de-mat)\n- [Floodwater Depth  in Saint-Louis and Matam Regions, Senegal  as of 23 October 2024](https://data.humdata.org/dataset/floodwater-depth-in-saint-louis-and-matam-regions-senegal-as-of-23-october-2024)\n- [UNOSAT Live Web Map - Inondations au Sénégal](https://data.humdata.org/dataset/unosat-live-web-map-inondations-au-senegal)\n\nRead [AGENTS.md](AGENTS.md) for how the collections