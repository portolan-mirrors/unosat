description: "UNOSAT geodata for Flood, Cameroon, 21 August 2024 (FL20240821CMR), from 2 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code: FL20240821CMR**  This map illustrates cumulative satellite-detected water extent in Farth-North Region, Cameroon between 18 to 22 September 2024. Within the cloud free analysed areas of about 34,000 km², a total of about 6,000 km² of lands appear to be affected with flood waters. Water extent appears to have increased of about 1,800 km² since the period between 16 to 20 August 2024. Based on Worldpop population data and the maximum flood water extent, ~415,000 people in Far-North Region are potentially exposed or living close to flooded areas, amongst which ~270,000 people in Logone-et-Chari Department and ~125,000 people in Mayo-Danay Department.\nThis is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to the United Nations Satellite Centre (UNOSAT).\n\nHDX datasets:\n\n- [Satellite detected water extents between 16 and 20 August 2024 over Far-North Region, Cameroon](https://data.humdata.org/dataset/water-extents-between-16-and-20-august-2024-over-far-north-region-cameroon)\n- [Satellite detected water extents between 18 and 22 September 2024 over Far-North Region, Cameroon](https://data.humdata.org/dataset/water-extents-between-18-and-22-september-2024-over-far-north-region-cameroon)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
