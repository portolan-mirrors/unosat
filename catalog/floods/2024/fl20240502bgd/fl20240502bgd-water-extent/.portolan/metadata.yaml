processing_notes: "Downloaded from HDX on 2026-11-22 and converted with GDAL ogr2ogr (to GeoPackage, multi-part geometry types, OGR_ORGANIZE_POLYGONS=CCW_INNER_JUST_AFTER_CW_OUTER) and geoparquet-io (GeoParquet 2.0, no geometry repair, bbox column added). Geometry is kept as published; no feature was repaired, dropped, or reprojected. Each layer's row count was checked against the source feature count. Layers merged with DuckDB `UNION ALL BY NAME`: a column a layer lacks is null for its rows. Coded geodatabase domains are decoded into `<field>_label` columns, per source file. Source layers: `GLOBAL_20240626_FloodExtent_Sunamganj`, `PHR_20240626_FloodExtent_SunamganjSadar`, `S1_20240619_20240622_FloodExtent_Sylhet`, `S1_20240619_20240622_WaterExtent_Sylhet`, `SAOCOM_20240626_FloodExtent_Sylhet`, `ST1_20240601_FloodExtent_Bangladesh`, `ST1_20240622_20240629_FloodExtent_Bangladesh`, `ST1_20240704_20240711_FloodExtent_Bangladesh`, `ST1_20240716_20240723_FloodExtent_Bangladesh`, `TDX1_20240601_FloodWater_Satkhira`."
known_issues: "HDX states the license as \"Creative Commons Attribution Share-Alike (CC BY-SA)\" with no version, so the collection's license is `other`, linked to the license definition HDX gives. This is a preliminary assessment and has not yet been validated in the field. It is important to consider the characteristics of the source imagery used in the analyses when interpreting results. For damage assessments it should be noted that only significant damage to the structural integrity of the buildings analyzed can be seen in imagery, while minor damage such as cracks or holes may not be visible at all. For flood extractions using radar data it is important to note that urban areas and highly vegetated areas may mask the flood signature and result in underestimation of flood waters. Users with specific questions or concerns should contact unosat@unitar.org to seek clarification."
