description: "UNOSAT geodata for Flood, Nigeria, 2 September 2024 (FL20240902NGA), from 5 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code: FL20240902NGA, GDACS ID: 1102720**  This map illustrates cumulative satellite-detected water using VIIRS in Nigeria between 09 to 13 November 2024. Within the cloud free analysed areas of about 900,000 km², a total of about 22,000 km² of lands appear to be affected with flood waters. Maximum flood water extent appears to have receded of about 5,700 km²\nsince the period between 27 to 31 October 2024. Based on Worldpop population data and the maximum flood water extent, about 5.8 million people remain potentially exposed or live close to flooded areas.\nThe pixelwise water fraction from VIIRS, using a 5-day composite at 375 m spatial resolution, indicates potential floodwater coverage ranging from 0% to 100%. This large-scale analysis is intended for guidance purposes and has not yet been validated with ground truth data or higher- resolution analysis. The population exposure\nanalysis is based on floodwaters observed only in cloud-free areas, so the total number of people exposed may be underestimated.\nThis is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to the United Nations Satellite Centre (UNOSAT).\n\nHDX datasets:\n\n- [Satellite detected water extent along the Komadugu Gana River, Bursari & Tarmua Local Government Area, Nigeria as of 15 September 2024](https://data.humdata.org/dataset/water-extent-along-the-komadugu-gana-river-bursari-tarmua-local-government-area-nigeria-as)\n- [Satellite detected water extent in Dikwa Town, Dikwa Local Government Area, Borno state, Nigeria as of 9 and 19 September 2024](https://data.humdata.org/dataset/water-extent-in-dikwa-town-dikwa-local-government-area-borno-state-nigeria-as-of-9-and-19-)\n- [Satellite detected water extents from 5 to 9 September 2024 over Nigeria](https://data.humdata.org/dataset