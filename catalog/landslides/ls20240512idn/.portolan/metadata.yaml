description: "UNOSAT geodata for Landslide, Indonesia, 12 May 2024 (LS20240512IDN), from 4 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code: LS20240512IDN, GDACS ID: 1102617**  This map illustrates satellite-detected mudslide / lahar in Lima Kaum, Rambatanm and Pariangan Districts, Tanah Datar Metropolitan, Sumatera Barat Province, Indonesia, as observed from a Pléiades image acquired on 17 May 2024. Within the analyzed area of about 50 km², about 1.3 km² mudslide / lahar extent was observed. Based on Worldpop population data and the maximal mudslide / lahar extent ~1,200 people are potentially exposed or living close to the affected areas.\nFurthermore, within the analyzed area, 240 buildings are identified as affected by the floods (1% from the total structures in the analysed area), along with about 2 km of roads, as of 17 May 2024\nThis is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to the United Nations Satellite Centre (UNOSAT).\n\nHDX datasets:\n\n- [Mudslide / Lahar impact in Canduang, Agam Metropolitan, Indonesia as of 23 May 2024](https://data.humdata.org/dataset/mudslide-lahar-impact-in-canduang-agam-metropolitan-indonesia-as-of-23-may-2024)\n- [Mudslide / Lahar impact in Lima Kaum, Rambatanm and Pariangan Districts, Indonesia, as of 17 May 2024](https://data.humdata.org/dataset/mudslide-lahar-impact-in-lima-kaum-rambatanm-and-pariangan-districts-indonesia-as-of-17-ma)\n- [Mudslide / Lahar impact in Sungai Pua and Banuhampu, Agam Metropolitan, Indonesia as of 20 May 2024](https://data.humdata.org/dataset/mudslide-lahar-impact-in-sungai-pua-and-banuhampu-agam-metropolitan-indonesia-as-of-20-may)\n- [UNOSAT Live Web map - Landslide in Indonesia](https://data.humdata.org/dataset/unosat-live-web-map-landslide-in-indonesia)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
