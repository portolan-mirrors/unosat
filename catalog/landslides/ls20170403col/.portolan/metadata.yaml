title: "Landslide, Colombia, 3 April 2017 (LS20170403COL)"
description: "UNOSAT geodata for Landslide, Colombia, 3 April 2017 (LS20170403COL), from 4 datasets on the Humanitarian Data Exchange. HDX describes the event:\n\nPosterior al deslizamiento de tierra que sembró el caos en la ciudad de Mocoa (Departamento de Putumayo, Colombia) el 31 de marzo de 2017 como consecuencia de las fuertes lluvias, el International Charter Space & Major Disasters fue activado bajo la petición de la Unidad Nacional para la Gestión del Riesgo de Desastres, IDEAM. En respuesta a la emergencia, UNITAR-UNOSAT ha llevado a cabo análisis visible de daño en las edificaciones causado por el deslizamiento de tierra, usando imágenes satelitales de alta resolución. Este mapa ilustra edificaciones dañadas detectadas en imágenes satelitales y la densidad de daño asociada en la ciudad de Mocoa y sus alrededores. El análisis ha sido conducido utilizando como imágenes post emergencia las adquiridas por los satélites Pleiades y GeoEye-1 el 7 y el 10 de abril de 2017 y como imágenes pre emergencia las adquiridas por los satélites WorldView-2 y WorldView-1 en las fechas del 21 de diciembre de 2016 y 26 de diciembre de 2013.  El resultado del análisis conducido por UNOSAT revela un total de 1,082 edificaciones dañadas, de las cuales 736 aparecen como destruidas en la imagen o arrastradas por el deslizamiento de tierra y 346 presentan daño severo. Debido al acusado ángulo y la cobertura de nubes de las imágenes satelitales, UNITAR-UNOSAT ha utilizado orthophotos colectadas por Corpoamazonia como fuente auxiliar de validación del análisis realizado con las imágenes satélites. Las orthophotos y otros datos secundarios fueron […]\n\nHDX datasets:\n\n- [Análisis de edificaciones visualmente dañadas en la ciudad de Mocoa, Colombia](https://data.humdata.org/dataset/analisis-de-edificaciones-visualmente-danadas-en-la-ciudad-de-mocoa-colombia)\n- [Colombia - Building Damage Assessment in the city of Mocoa](https://data.humdata.org/dataset/building-damage-assessment-in-the-city-of-mocoa-colombia)\n- [Colombia - Potentially Affected Zones by the Mudflow in Mocoa](https://data.humdata.org/dataset/potentially-affected-zones-by-the-mudflow-in-mocoa-colombia-situation-as-of-10-april-2017)\n- [Colombia - Satellite detected potentially affected zones by the mudflow in Mocoa.](https://data.humdata.org/dataset/satellite-detected-potentially-affected-zones-by-the-mudflow-in-mocoa-colombia)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
