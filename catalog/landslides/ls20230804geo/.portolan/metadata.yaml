description: "UNOSAT geodata for Landslide, Georgia, 4 August 2023 (LS20230804GEO), from 1 dataset on the Humanitarian Data Exchange. HDX describes the event:\n\n**UNOSAT code LS20230804GEO, GDACS Id: 1102154**  This map illustrates satellite-detected landslides/mudflow in Oni District, Racha-Lechkhumi and Kvemo Svaneti Region, Georgia as observed from a Pléiades imagery acquired on 06 August 2023 at 14:30 local time.\nWithin the analyzed area of 9,600 ha, about 220 ha of landslide scars were observed. UNITAR-UNOSAT identified 30 affected structures and 6 potentially affected structures.\nThis is a preliminary analysis and has not yet been validated in the field. Please send ground feedback to United Nations Satellite Centre (UNOSAT).\n\nHDX datasets:\n\n- [Landslide impact analysis in Oni District, Racha-Lechkhumi and Kvemo Svaneti Region, Georgia as of 06 August 2023](https://data.humdata.org/dataset/landslide-impact-analysis-in-oni-district-racha-lechkhumi-and-kvemo-svaneti-region-georgia)\n\nRead [AGENTS.md](AGENTS.md) for how the collections were built."
